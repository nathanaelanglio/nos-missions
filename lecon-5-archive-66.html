<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archive 66</title>


<!--
  Archive 66, leçon 05 : version famille, à rejouer à la maison.
  Une seule chose à lire par écran. Aucun clignotement, aucune boucle, aucun compte à rebours. Tout mouvement
  s'arrête si l'appareil demande « moins de mouvement ». Son : module commun de Milo (sons.js), inclus tel quel.
  Aucune ressource externe, aucune image extérieure. L'état est gardé dans le navigateur ; « Recommencer » l'efface.
-->

<style>
/* thème par défaut : l'archive, brun noyer très sombre, jamais noir pur */
:root{
  color-scheme: dark;
  --bg:#211711; --bg2:#2B1E16; --panneau:#36271D; --panneau-b:#5C4532; --line:#7A5E44;
  --txt:#F7ECDA; --txt2:#DCC8A8; --ambre-t:#F3C56E; --or-t:#F1D08A; --cire-t:#F0A39A; --vert-t:#A9DDB4;
  --salle-off:#3A2B20; --salle-offb:#7A6048; --couloir:#4A3729; --etag:#6A4F39; --lueur:rgba(255,196,110,.13); --lueur2:rgba(255,196,110,.24);
  --creme:#FBF3E2; --encre:#1E2F57; --creme-b:#E2CFA6; --ref:#7A4E12; --mark:rgba(240,190,90,.45);
  --titre-f: Georgia, 'Times New Roman', serif;
  --lire-f: Verdana, 'Atkinson Hyperlegible', Tahoma, 'Segoe UI', system-ui, sans-serif;
}
/* thème clair, au choix : salle de lecture en plein jour */
html[data-theme="clair"]{
  color-scheme: light;
  --bg:#F2E8D6; --bg2:#E8D9BF; --panneau:#FFF9EE; --panneau-b:#D6C09A; --line:#B89C72;
  --txt:#2A1C12; --txt2:#5C4330; --ambre-t:#764604; --or-t:#7A560A; --cire-t:#8E2620; --vert-t:#24663F;
  --salle-off:#E6D8BD; --salle-offb:#A88C64; --couloir:#D2BE9A; --etag:#BFA27A; --lueur:rgba(255,190,90,.20); --lueur2:rgba(255,190,90,.34);
}
*{ box-sizing:border-box }
html,body{ margin:0; color:var(--txt); font-family:var(--lire-f); -webkit-tap-highlight-color:transparent }
html{ background:var(--bg) }
body{ min-height:100dvh; background:linear-gradient(180deg, var(--bg2), var(--bg) 60%);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px) }
button{ font:inherit; color:inherit }
[hidden]{ display:none !important }

/* ---------- décor : des étagères dans la pénombre, des lampes ; rien ne bouge ---------- */
.decor{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden }
.decor .lampes{ position:absolute; inset:0; transition:opacity 1s ease; opacity:.55;
  background:radial-gradient(circle at 18% -4%, var(--lueur2), transparent 34%), radial-gradient(circle at 82% -2%, var(--lueur2), transparent 30%),
             radial-gradient(ellipse at 50% 108%, var(--lueur), transparent 55%) }
body.allume .decor .lampes{ opacity:1 }
.decor .rayon{ position:absolute; top:0; bottom:0; width:54px; opacity:.5 }
.decor .rayon.g{ left:0 } .decor .rayon.d{ right:0 }
.decor .rayon rect{ fill:var(--etag) }
@media (max-width:620px){ .decor .rayon{ display:none } }

/* ---------- barre du haut ---------- */
.top{ position:relative; z-index:2; display:flex; align-items:center; gap:10px; height:64px; margin-top:env(safe-area-inset-top, 0px) }
.top .mini{ display:flex; align-items:center; gap:8px; opacity:0; transition:opacity 1s ease; min-width:0; flex:1 }
.top .mini.on{ opacity:1 }
.top .mini svg{ width:38px; height:38px; flex:none }
.top .mini span{ font-size:16px; font-weight:700; color:var(--ambre-t); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.top .nom{ font-family:var(--titre-f); font-size:18px; font-weight:700; letter-spacing:.04em; color:var(--txt2); white-space:nowrap; padding-right:4px }
.top .hfin{ font-size:15px; font-weight:700; color:var(--txt2); white-space:nowrap }
.top .reset{ min-height:48px; padding:0 14px; border:1px solid var(--line); background:var(--panneau); border-radius:12px; font-size:15px; font-weight:700; color:var(--txt2); cursor:pointer }
@media (max-width:520px){ .top{ gap:6px } .top .nom{ display:none } .top .reset{ padding:0 8px; font-size:13px } .top .mini .cdt{ display:none } .hp{ width:42px }
  .top .hfin{ font-size:13px } }
.slot-hp{ display:inline-flex; align-items:center; flex:none; gap:2px }
.hp{ width:48px; height:48px; border:0; background:transparent; color:var(--txt2); border-radius:12px; display:grid; place-items:center; cursor:pointer; padding:0 }
.hp svg{ width:28px; height:28px }
.confirm{ position:fixed; left:0; right:0; top:0; z-index:30; background:var(--panneau); color:var(--txt); border-bottom:1px solid var(--panneau-b);
  padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:19px; box-shadow:0 8px 30px rgba(10,5,0,.3) }
.confirm span{ flex:1 1 220px }

/* ---------- mouvement : doux, une seconde au plus, jamais en boucle ---------- */
#app{ position:relative; z-index:1 }
.screen{ animation:entree .6s cubic-bezier(.2,.8,.2,1) both }
@keyframes entree{ from{ opacity:0; transform:scale(.985) } to{ opacity:1; transform:none } }
@keyframes fondu{ from{ opacity:0 } to{ opacity:1 } }
.halo-t{ position:absolute; border-radius:50%; pointer-events:none; width:16px; height:16px; margin:-8px 0 0 -8px;
  background:radial-gradient(circle, rgba(255,240,210,.55), rgba(243,197,110,.25) 60%, transparent 70%); animation:halo .7s ease-out forwards; z-index:3 }
@keyframes halo{ from{ transform:scale(1); opacity:1 } to{ transform:scale(9); opacity:0 } }
.rebond{ animation:rebond .45s cubic-bezier(.3,1.6,.5,1) }
@keyframes rebond{ 0%{ transform:scale(1) } 40%{ transform:scale(.95) } 100%{ transform:scale(1) } }
.brille{ position:relative; overflow:hidden }
.brille::after{ content:""; position:absolute; top:-20%; bottom:-20%; left:-60%; width:45%; transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,240,200,.7), transparent); animation:balaye 1s ease-out forwards; pointer-events:none }
@keyframes balaye{ from{ left:-60% } to{ left:120% } }
.particule{ position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:40;
  background:radial-gradient(circle, #FFF4D6, #F0C45E 60%, rgba(240,196,94,0) 70%); animation:monte 1s ease-out forwards }
.particule.verte{ background:radial-gradient(circle, #EFFFF2, #9AD6A8 60%, rgba(154,214,168,0) 70%) }
@keyframes monte{ 0%{ opacity:0; transform:translate(0,0) scale(.6) } 15%{ opacity:1 } 100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1) } }
.pose{ animation:pose .8s cubic-bezier(.3,1.3,.5,1) both }
@keyframes pose{ from{ transform:scale(1.35) translateY(-14px); opacity:0 } 60%{ transform:scale(.97); opacity:1 } to{ transform:none; opacity:1 } }

/* ---------- boutons ---------- */
.big{ display:inline-flex; align-items:center; justify-content:center; gap:12px; min-height:76px; min-width:76px; padding:0 30px;
  border-radius:20px; border:2px solid #E6B865; background:linear-gradient(180deg,#2A4777,#1C3259); color:#FFF7E8;
  font-family:var(--lire-f); font-size:23px; font-weight:700; letter-spacing:.02em; cursor:pointer;
  box-shadow:0 0 0 5px rgba(230,184,101,.16), 0 8px 22px rgba(10,5,0,.3); transition:transform .3s ease }
.big:active{ transform:translateY(2px) }
.big svg{ width:34px; height:34px; flex:none }
.big.or{ border-color:#F6D894; background:linear-gradient(180deg,#8C600F,#6F4B0B); box-shadow:0 0 0 5px rgba(246,216,148,.2), 0 8px 22px rgba(10,5,0,.3) }
.big.cire{ border-color:#F0A39A; background:linear-gradient(180deg,#9C2E27,#74201B); box-shadow:0 0 0 5px rgba(240,163,154,.18), 0 8px 22px rgba(10,5,0,.3) }
.big[disabled]{ opacity:.45 }
.btn{ min-height:58px; padding:0 20px; border-radius:16px; border:2px solid var(--line); background:var(--panneau); color:var(--txt);
  font-family:var(--lire-f); font-size:18px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px }
.btn svg{ width:24px; height:24px; flex:none }
.btn.on{ border-color:#4FA36E; background:#DFF2E4; color:#174A2C }
.btn.leger{ border-color:transparent; background:transparent; color:var(--txt2); font-weight:700 }
.row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center }

/* ---------- une scène = une chose à lire ---------- */
.scene{ min-height:calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; align-items:center; gap:22px; padding:6px 0 28px }
.scene .haut{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100% }
.hud{ font-family:var(--lire-f); font-size:17px; font-weight:700; letter-spacing:.03em; color:var(--ambre-t); margin:0; text-align:center }
.pas{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:100% }
.pas i{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--salle-offb); display:block; transition:background .8s ease }
.pas i.fait{ background:var(--salle-offb) }
.pas i.ici{ background:var(--ambre-t); border-color:var(--ambre-t) }
.milieu{ flex:1; width:100%; max-width:680px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; min-width:0 }
.milieu.large{ max-width:920px }
.bas{ width:100%; max-width:680px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between }
.bas .big{ margin-left:auto }

/* panneau de bois clair pour les consignes ; parchemin crème pour tout ce qui se lit */
.panneau{ width:100%; background:var(--panneau); border:1px solid var(--panneau-b); border-radius:22px; padding:28px 30px; min-width:0;
  box-shadow:0 10px 30px rgba(10,5,0,.18) }
.question{ font-family:var(--lire-f); font-size:26px; line-height:1.6; letter-spacing:.02em; word-spacing:.1em; margin:0; color:var(--txt); max-width:24em }
.phrase{ font-family:var(--lire-f); font-size:26px; line-height:1.6; letter-spacing:.02em; word-spacing:.1em; margin:0; color:var(--txt) }
.phrase.petite{ font-size:22px; color:var(--txt2) }
.aide-btn{ margin-top:22px; min-height:48px; padding:0 16px; border-radius:12px; border:1.5px dashed var(--ambre-t); background:transparent; color:var(--ambre-t);
  font-size:16px; font-weight:700; cursor:pointer }
.aide{ margin:20px 0 0; font-size:22px; line-height:1.6; letter-spacing:.02em; color:var(--txt2); animation:fondu .6s ease both }
.lire{ width:100%; background:var(--creme); color:var(--encre); border:1px solid var(--creme-b); border-radius:22px; padding:28px 32px; min-width:0;
  box-shadow:0 10px 30px rgba(10,5,0,.2) }
.lire .ref{ font-family:var(--lire-f); font-size:19px; font-weight:700; letter-spacing:.02em; color:var(--ref); margin:0 0 14px }
.lire .frag{ font-family:var(--lire-f); font-size:24px; line-height:1.7; letter-spacing:.03em; word-spacing:.12em; margin:0; max-width:34em; animation:fondu .6s ease both }
.lire mark{ background:var(--mark); color:inherit; border-radius:5px; padding:0 .12em; box-decoration-break:clone; -webkit-box-decoration-break:clone; transition:box-shadow 1s ease }
.lire.dure mark{ box-shadow:0 0 0 3px rgba(240,190,90,.55), 0 0 16px rgba(240,190,90,.65) }
.lecon{ background:var(--creme); color:var(--encre); border-color:var(--creme-b) }
.lecon p{ font-family:var(--lire-f); font-size:22px; line-height:1.7; letter-spacing:.02em; word-spacing:.1em; margin:0; max-width:36em; color:var(--encre) }
.lecon p + p{ margin-top:16px }
.livre{ display:flex; align-items:center; gap:10px; margin:0; font-size:17px; line-height:1.5; color:var(--txt2); text-align:left;
  background:var(--panneau); border:1px solid var(--panneau-b); border-radius:14px; padding:10px 16px; max-width:30em }
.livre svg{ width:30px; height:30px; flex:none }
.video{ display:flex; gap:18px; align-items:center }
.video svg{ width:64px; height:64px; flex:none }
.video .vt{ margin:0 0 6px; font-size:17px; font-weight:700; color:var(--ambre-t) }
img.lff{ display:block; width:100%; height:auto; border-radius:18px; border:1px solid var(--panneau-b) }
img.vignette{ max-width:360px; margin:0 auto }
img.mini{ max-width:220px; margin:0 auto }
/* le lecteur du bus : le bandeau « 05 » de la leçon est retiré à droite, le lecteur reste entier (trame, partie G) */
img.bus{ aspect-ratio:3.08; object-fit:cover; object-position:left center }
img.haute{ max-height:36vh; width:auto; max-width:100%; margin:0 auto }
.champ, textarea.champ{ width:100%; border-radius:14px; border:1.5px solid var(--line); padding:14px 16px; font-family:var(--lire-f); font-size:22px;
  background:#FFFDF8; color:#1E2F57; letter-spacing:.02em }
textarea.champ{ min-height:96px; resize:vertical }
.liste{ margin:16px 0 0; padding-left:22px; font-size:20px; line-height:1.6 }
/* repli pour l'adulte : fermé par défaut */
details.repli{ width:100%; max-width:680px; border-radius:14px; border:1px dashed var(--panneau-b); background:var(--panneau); opacity:.95 }
details.repli summary{ list-style:none; cursor:pointer; min-height:48px; display:flex; align-items:center; gap:8px; padding:0 16px;
  font-size:15px; font-weight:700; color:var(--txt2) }
details.repli summary::-webkit-details-marker{ display:none }
.repli-c{ padding:0 18px 16px; font-size:17px; line-height:1.55; color:var(--txt) }
.repli-c p{ margin:0 0 10px }
.repli-c b{ color:var(--ambre-t) }
.repli-c .champ{ font-size:18px }

/* ---------- entrée, carte d'archiviste, pli scellé ---------- */
.centre{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center;
  min-height:calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding:8px 0 28px }
.titre{ font-family:var(--titre-f); font-size:clamp(44px, 8vw, 76px); font-weight:700; letter-spacing:.03em; margin:0; color:var(--txt);
  text-shadow:0 0 26px rgba(243,197,110,.35) }
.sous{ font-family:var(--lire-f); font-size:clamp(20px, 3.4vw, 25px); color:var(--txt2); margin:-8px 0 0 }
.arche{ position:relative; width:min(88vw, 560px); aspect-ratio:16/9; border-radius:280px 280px 16px 16px / 200px 200px 16px 16px; overflow:hidden;
  border:6px solid #8A6A45; box-shadow:0 0 0 3px #C9A86A, 0 0 34px rgba(243,197,110,.25); background:#2B1E16 }
.arche img, .arche > svg{ display:block; width:100%; height:100%; object-fit:cover; border:0; border-radius:0 }
.plaque{ margin:0; padding:12px 26px; border-radius:12px; background:linear-gradient(180deg,#6B4A2E,#4E341F); border:2px solid #C9A86A;
  color:#FBF0D8; font-family:var(--lire-f); font-size:clamp(20px,3.2vw,24px); font-weight:700; box-shadow:inset 0 2px 6px rgba(0,0,0,.35) }
.badge{ position:relative; width:min(90vw, 470px); aspect-ratio:85.6/54; border-radius:18px; text-align:left; color:var(--encre);
  background:linear-gradient(160deg,#FFF8E9,#F3E3C0); border:2px solid #C9A86A; padding:5% 6%; overflow:hidden;
  box-shadow:0 0 0 6px rgba(201,168,106,.18), 0 14px 34px rgba(10,5,0,.35) }
.badge .b-ent{ font-weight:700; letter-spacing:.03em; font-size:clamp(14px,2.4vw,17px); color:var(--ref) }
.badge .b-corps{ display:flex; gap:5%; margin-top:6%; align-items:center }
.badge .b-av{ width:24%; aspect-ratio:1; flex:none }
.badge .b-lig{ font-size:clamp(13px,2vw,16px); color:#5C4330; margin:0 0 6px }
.badge .b-val{ font-family:var(--lire-f); font-weight:700; font-size:clamp(22px,4vw,30px); margin:0; word-break:break-word }
.badge .b-recit{ font-size:clamp(13px,2vw,16px); color:#5C4330; margin:8px 0 0 }
.tampon{ position:absolute; right:5%; bottom:8%; padding:6px 14px; border:3px solid #8E2620; border-radius:12px; color:#8E2620; background:rgba(255,248,233,.7);
  font-weight:700; font-size:clamp(14px,2.6vw,19px); transform:rotate(-6deg) scale(1.5); opacity:0; transition:transform .9s ease, opacity .9s ease }
.tampon.on{ transform:rotate(-6deg) scale(1); opacity:1 }
.pli-svg{ width:min(70vw, 300px); height:auto; overflow:visible }
.pli-svg .sc-r{ transform-box:view-box; transform-origin:100px 64px }
.pli-svg .m-g, .pli-svg .m-d{ transition:transform .7s ease, opacity .7s ease; transform-box:view-box; transform-origin:100px 64px }
.pli-svg.brise .m-g{ transform:translate(-14px,10px) rotate(-18deg); opacity:0 }
.pli-svg.brise .m-d{ transform:translate(14px,10px) rotate(18deg); opacity:0 }
.feuille{ transform-origin:50% 0; animation:deplie .7s ease both }
@keyframes deplie{ from{ transform:scaleY(.3); opacity:0 } to{ transform:none; opacity:1 } }
.feuille.plie{ animation:plie .6s ease forwards }
@keyframes plie{ from{ transform:none; opacity:1 } to{ transform:scaleY(.25); opacity:0 } }
.feuille .frag{ white-space:pre-wrap }
.cachet{ display:flex; align-items:center; gap:10px; justify-content:center; margin:0; font-size:17px; font-weight:700; color:var(--cire-t) }
.cachet svg{ width:40px; height:40px; flex:none }

/* ---------- le plan de l'archive ---------- */
.plateau{ display:grid; gap:14px; height:max(600px, calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px));
  grid-template-rows:minmax(330px,1fr) auto; padding-bottom:12px }
.plateau .board{ min-height:0; display:flex; justify-content:center }
.plateau .board svg{ width:100%; height:100%; max-width:560px }
.plateau .side{ display:flex; flex-direction:column; gap:12px; align-items:stretch; width:100%; max-width:520px; margin:0 auto }
.plateau .side .big{ width:100% }
@media (orientation:landscape) and (min-width:700px){
  .plateau{ grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr) 300px }
  .plateau .side{ justify-content:center }
}
.salle .mur{ transition:fill 1s ease }
.salle .lampe-l{ transition:opacity 1s ease }
.etat{ font-size:17px; font-weight:700; color:var(--txt2); text-align:center; margin:0 }

/* ---------- salles ---------- */
.niche{ position:relative; width:min(56vw, 260px); aspect-ratio:4/5; border-radius:130px 130px 16px 16px; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 30%, #5A4029, #2B1E16 75%); border:6px solid #8A6A45; box-shadow:0 0 0 3px #C9A86A, 0 0 30px rgba(243,197,110,.2) }
.niche.img{ width:min(84vw, 520px); aspect-ratio:16/9; border-radius:260px 260px 16px 16px / 190px 190px 16px 16px }
.niche > svg.pic{ width:58%; height:auto }
.niche img{ width:100%; height:100%; object-fit:cover; border:0; border-radius:0 }
.nom-niv{ font-family:var(--titre-f); font-size:clamp(30px,5vw,42px); font-weight:700; letter-spacing:.06em; margin:0; color:var(--txt); text-align:center }
.g-sceau{ width:min(46vw, 210px); height:auto; overflow:visible }
.coeur{ width:min(30vw, 120px); height:auto }

/* cartes et rouleaux à retourner : les deux faces dans la même case, la carte prend la hauteur de la plus haute */
.flip{ border:0; background:none; padding:0; perspective:1000px; cursor:pointer; min-width:0; width:100%; text-align:center }
.flip .in{ display:grid; transform-style:preserve-3d; transition:transform .9s ease; height:100% }
.flip.ouverte .in{ transform:rotateY(180deg) }
.flip .f{ grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; padding:16px 12px; min-width:0 }
.flip .face{ transform:rotateY(180deg) }
.rouleaux{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; width:100% }
.rouleau .f{ background:linear-gradient(180deg,#FBF1DA,#F1DFB6); color:var(--encre); border-radius:10px; min-height:230px;
  border-top:12px solid #8A5E36; border-bottom:12px solid #8A5E36; box-shadow:0 8px 20px rgba(10,5,0,.25) }
.rouleau .f svg{ width:62%; max-width:110px; height:auto; flex:none }
.rouleau .lab{ font-size:20px; font-weight:700; margin:0 }
.rouleau .ecr{ width:80%; height:auto }
.rouleau.ouverte .face{ box-shadow:0 0 0 3px #E6B865, 0 0 22px rgba(240,190,90,.6) }
.ligne-r{ margin:0; font-size:22px; line-height:1.6; color:var(--txt2); text-align:center }

/* la voûte : quatre tiroirs */
.voute{ display:grid; grid-template-columns:1fr 1fr; gap:18px; width:100% }
.voute .col{ display:flex; flex-direction:column; gap:12px; min-width:0 }
.col-lab{ font-family:var(--titre-f); font-size:18px; font-weight:700; letter-spacing:.08em; margin:0; color:var(--txt2) }
.tiroir{ width:100%; border:0; padding:0; background:none; cursor:pointer; text-align:left; border-radius:14px; transition:box-shadow .8s ease }
.tiroir .front{ display:flex; align-items:center; gap:12px; min-height:68px; padding:8px 14px; border-radius:12px;
  background:linear-gradient(180deg,#7A5236,#5E3E28); border:2px solid #3E281A; color:#FBF0D8; box-shadow:inset 0 2px 0 rgba(255,230,190,.18) }
.tiroir .front .pic{ width:46px; height:46px; flex:none; border-radius:50%; background:#FBF1DA; display:grid; place-items:center }
.tiroir .front .pic svg{ width:36px; height:36px }
.tiroir .front .t-nom{ font-family:var(--titre-f); font-size:17px; font-weight:700; letter-spacing:.08em; flex:1 }
.tiroir .front .poignee{ width:44px; height:12px; border-radius:6px; background:linear-gradient(180deg,#F1D08A,#B98A2E); border:1px solid #6E4E14; flex:none }
.tiroir .contenu{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .6s ease }
.tiroir.ouvert .contenu{ grid-template-rows:1fr }
.tiroir .contenu > div{ overflow:hidden; min-height:0 }
.tiroir .texte{ margin:8px 6px 0; padding:16px 18px; border-radius:10px; background:var(--creme); color:var(--encre); border:1px solid var(--creme-b);
  font-size:21px; line-height:1.55; letter-spacing:.02em }
.tiroir .texte img{ float:left; width:128px; height:auto; border-radius:8px; margin:4px 14px 4px 0 }
.tiroir .texte::after{ content:""; display:block; clear:both }
.tiroir.ok{ box-shadow:0 0 0 3px #E6B865, 0 0 22px rgba(240,190,90,.55) }

/* Isaïe 40:8 : la fleur */
.fleur-z{ display:flex; gap:18px; align-items:center; width:100% }
.fleur-z .lire{ flex:1 }
.fleur-b{ border:0; background:none; padding:0; cursor:pointer; flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--txt2); font-size:16px; font-weight:700 }
.fleur{ width:110px; height:auto; overflow:visible }
.fleur .tige{ transform-box:view-box; transform-origin:50px 146px; transition:transform 1s ease }
.fleur .p{ transition:fill 1s ease, opacity 1s ease }
.fleur.fane .tige{ transform:rotate(32deg) }
.fleur.fane .p{ fill:#B79A86; opacity:.7 }

/* la dictée */
.modes{ display:flex; gap:10px; flex-wrap:wrap }
.dessin{ width:100%; height:220px; border-radius:14px; border:1.5px solid var(--line); background:#FBF3E2; touch-action:none; display:block }
.lettre{ width:100%; background:var(--creme); color:var(--encre); border:1px solid var(--creme-b); border-radius:8px 8px 22px 22px; padding:26px 30px;
  box-shadow:0 10px 30px rgba(10,5,0,.2); font-size:26px; line-height:1.6; white-space:pre-wrap; word-break:break-word }
.lettre img{ display:block; width:auto; max-width:100%; height:auto; max-height:22vh; margin:0 auto }
.qd{ width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; animation:fondu .6s ease both }
.qd .row .btn{ min-width:120px; font-size:20px }
.secr{ width:min(80vw, 320px); height:auto }

/* le relais */
.frise{ position:relative; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; width:100% }
.main-b{ border:2px dashed transparent; background:var(--panneau); border-radius:16px; cursor:pointer; padding:10px 8px 14px; min-width:0;
  display:grid; grid-template-rows:44px auto auto; justify-items:center; align-items:center; gap:6px; color:var(--txt) }
.main-b.suivante{ border-color:var(--ambre-t) }
.main-b.toi .m-lab{ color:var(--ambre-t) }
.main-b .main-svg{ width:70px; height:auto; margin-top:-14px }
.porte{ position:relative; z-index:1 }
.main-b .m-lab{ font-size:17px; font-weight:700; line-height:1.35; text-align:center }
.porte{ width:48px; height:40px; display:grid; place-items:center }
.porte svg{ width:48px; height:auto }
@media (max-width:620px){
  .frise{ grid-template-columns:1fr }
  .main-b{ grid-template-rows:auto; grid-template-columns:52px 64px minmax(0,1fr); justify-items:start; padding:8px 12px }
  .main-b .main-svg{ width:56px; margin-top:0 } .main-b .m-lab{ text-align:left }
}

/* les trois nombres */
.nombres{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; width:100% }
.nb .dos{ background:linear-gradient(180deg,#6B4A2E,#4E341F); border:3px solid #C9A86A; min-height:250px }
.nb .dos svg{ width:56%; max-width:110px; height:auto }
.nb .dos .k{ font-family:var(--titre-f); font-size:22px; font-weight:700; color:#FBF0D8 }
.nb .face{ background:var(--creme); color:var(--encre); border:3px solid #C9A86A; justify-content:flex-start }
.nb .face svg{ width:64px; height:auto; flex:none }
.nb .gros{ font-size:26px; font-weight:700; color:var(--ref); margin:0; white-space:nowrap }
.nb .t{ font-size:21px; line-height:1.5; margin:0; text-align:left }
.nb.ouverte .face{ box-shadow:0 0 0 3px #E6B865, 0 0 20px rgba(240,190,90,.5) }
.chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center }
.chips span{ padding:8px 16px; border-radius:999px; background:var(--creme); color:var(--ref); font-size:20px; font-weight:700; border:1px solid var(--creme-b); white-space:nowrap }
.sceaux{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center }
.sceaux button{ border:2px solid transparent; background:transparent; border-radius:50%; padding:2px; cursor:pointer }
.sceaux button.on{ border-color:var(--ambre-t) }
.sceaux svg{ width:76px; height:76px }

/* le volume : les 66 livres deviennent un seul Livre */
.etagere{ width:100%; border-radius:20px; background:radial-gradient(ellipse at 50% 30%, #4A3424, #241912 80%); border:1px solid #6B4F38; overflow:hidden }
.etagere svg{ display:block; width:100%; height:auto }
.vol .lv{ transform-box:fill-box; transform-origin:50% 100%; transition:transform .8s cubic-bezier(.5,0,.3,1), opacity .8s ease }
.vol.on .lv{ transform:translateX(var(--dx)) scaleY(.7); opacity:0 }
.vol .grand{ opacity:0; transform-box:fill-box; transform-origin:50% 50% }
.vol.on .grand{ animation:grand 1.5s ease .5s both }
@keyframes grand{ 0%{ opacity:0; transform:scale(.4) } 45%{ opacity:1; transform:none } 80%{ opacity:1; transform:none } 100%{ opacity:0; transform:none } }
.vol .ouvert{ opacity:0; transform-box:fill-box; transform-origin:50% 50% }
.vol.on .ouvert{ animation:ouvre .7s ease 1.7s both }
@keyframes ouvre{ from{ opacity:0; transform:scaleX(.3) } to{ opacity:1; transform:none } }
.vol.deja .lv{ transition:none; transform:translateX(var(--dx)) scaleY(.7); opacity:0 }
.vol.deja .grand{ animation:none; opacity:0 }
.vol.deja .ouvert{ animation:none; opacity:1 }

/* les récits */
.recits{ display:flex; flex-direction:column; gap:10px; width:100% }
.recits .btn{ justify-content:flex-start; text-align:left; padding:10px 18px; min-height:64px; flex-direction:column; align-items:flex-start; gap:2px; font-size:20px }
.recits .btn small{ font-size:17px; font-weight:400; color:inherit }
.carte-mini{ display:flex; align-items:center; gap:14px; width:min(100%, 470px); padding:12px 18px; border-radius:16px; text-align:left;
  background:linear-gradient(160deg,#FFF8E9,#F3E3C0); border:2px solid #C9A86A; color:var(--encre); box-shadow:0 8px 22px rgba(10,5,0,.3) }
.carte-mini svg{ width:48px; height:48px; flex:none }
.carte-mini p{ margin:0 } .cm-nom{ font-size:20px; font-weight:700 } .cm-rc{ font-size:18px; color:#5C4330; margin-top:4px }

/* l'enveloppe Mission 6 */
.env-b{ border:0; background:none; padding:0; cursor:pointer; border-radius:16px }
.env{ width:min(70vw, 300px); height:auto; overflow:visible }
.env .rabat{ transform-box:view-box; transform-origin:60px 18px; transition:transform .9s ease }
.env.ouverte .rabat{ transform:scaleY(-1) }
.env .lettre-e{ transition:transform .9s ease .3s; transform:translateY(8px) }
.env.ouverte .lettre-e{ transform:translateY(-26px) }
.env .sc-e{ transition:opacity .5s ease }
.env.ouverte .sc-e{ opacity:0 }

/* ---------- tablette couchée : tout tient sans défiler ---------- */
@media (orientation:landscape) and (max-height:820px){
  .scene{ gap:12px; padding-bottom:16px } .milieu{ gap:16px } .scene .haut{ gap:6px }
  .niche{ width:min(30vh, 220px) } .niche.img{ width:min(64vh, 480px) } .g-sceau{ width:min(26vh, 190px) } .coeur{ width:min(13vh, 100px) }
  img.haute{ max-height:36vh } .rouleau .f{ min-height:190px } .nb .dos{ min-height:200px }
  .panneau, .lire{ padding:22px 28px } .aide-btn{ margin-top:14px } .tiroir .texte{ font-size:20px; padding:12px 16px } .tiroir .front{ min-height:60px }
  .recits{ display:grid; grid-template-columns:1fr 1fr } .recits .btn{ min-height:58px; font-size:19px }
  .titre{ font-size:clamp(40px, 7vh, 64px) } .arche{ width:min(84vw, 64vh, 520px) }
}

/* ---------- téléphone ---------- */
@media (max-width:520px){
  .panneau, .lire{ padding:22px 20px; border-radius:20px }
  .question{ font-size:23px } .phrase{ font-size:23px } .phrase.petite{ font-size:20px }
  .lire .frag{ font-size:22px } .lecon p{ font-size:22px } .lettre{ font-size:23px; padding:22px }
  .big{ font-size:20px; min-height:68px; padding:0 22px } .btn{ font-size:16px; padding:0 16px }
  .milieu{ gap:22px } .bas .big{ margin-left:0; flex:1 }
  .rouleaux{ gap:8px } .rouleau .f{ min-height:180px; padding:12px 6px } .rouleau .lab{ font-size:17px }
  .voute{ grid-template-columns:1fr } .nombres{ grid-template-columns:1fr } .nb .dos{ min-height:140px } .nb .dos svg{ width:70px }
  .fleur-z{ flex-direction:column } .fleur{ width:90px }
  .tiroir .texte{ font-size:20px } .tiroir .texte img{ float:none; display:block; width:100%; max-width:220px; margin:0 0 10px }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01s !important; animation-iteration-count:1 !important; transition-duration:.01s !important; animation-delay:0s !important; transition-delay:0s !important }
  .particule, .halo-t{ display:none }
}

<!-- MODULE SONS : contenu de sons-communs/sons.js (Milo), inséré tel quel par construire.ps1. Ne pas modifier : veto de Milo. -->
<script id="module-sons">
/* =====================================================================
   Sons communs des lecons - sons.js (version 2, 05/11/2026)
   Auteur : Milo (son). Module autonome, Web Audio API, aucun fichier audio,
   aucune ressource externe. Expose window.SonsV (meme API que Protocole V,
   plus SonsV.mesurer() pour le controle sans oreille).

   Joueur tres sensible au bruit, ecoute sur haut-parleur de tablette.
   Seuils fixes, verifies par SonsV.verifier() (tableau vide = tout est tenu) :
     NIVEAUX (crete en sortie, borne haute : somme des cretes des voix en phase)
     - volume par defaut : chaque son entre -15 et -10 dBFS (cible -12)
     - volume maximal    : aucun son au-dessus de -6 dBFS
     - garde-fou de sortie : lineaire jusqu'a -6 dBFS, arrondi au-dessus,
       plafond absolu -2,5 dBFS. Pas de compresseur (son gain de rattrapage
       automatique faussait les dBFS de la version 1).
     SPECTRE (petits haut-parleurs : rien d'utile sous ~400 Hz)
     - fondamentale entre 440 et 2000 Hz
     - harmonique ajoutee (2x) jusqu'a 3200 Hz, toujours plus faible que sa fondamentale
     - filtre du souffle entre 500 et 2500 Hz
     - passe-bas general a 4 kHz : rien d'aigu ni de percant
     ENVELOPPE
     - attaque >= 5 ms (pas de clic sec)
     - decroissance exponentielle jusqu'a -20 dB, puis extinction lineaire en 20 ms
     - crete par voix <= 0,5 avant le gain maitre
     - durees max : pop 0,16 s · carte 0,18 s · etape 0,40 s · paire 0,40 s
                    sceau 0,70 s · victoire 1,40 s
     - rien en boucle, rien en fond ; un meme son ne se relance pas a moins de 60 ms
   Chaine : voix -> bus -> passe-bas 4 kHz -> gain maitre -> garde-fou -> sortie.
   Premier toucher : le son demande avant que le contexte soit "running" est mis
   en file d'attente (3 au plus) et joue des que le contexte demarre, s'il a
   moins de 0,6 s ; plus vieux, il est abandonne pour ne pas tomber a contretemps.
   Tonalite unique : do majeur.
   ===================================================================== */
(function () {
  'use strict';

  var CLE_MUET = 'sonsCommuns.muet';
  var CLE_MUET_V1 = 'protocoleV.sons.muet';      // le choix "muet" fait en lecon 3 est respecte
  var CLE_VOL = 'sonsCommuns.volume';            // nouvelle cle : l'ancien 0,15 enregistre ne revient pas
  var VOL_DEFAUT = 0.5, VOL_MAX = 0.7;           // -6 dB et -3,1 dB de gain maitre
  var DBFS_DEFAUT_MIN = -15, DBFS_DEFAUT_MAX = -10, DBFS_PLAFOND = -6;
  var F_MIN = 440, F_MAX = 2000, H_MAX = 3200, FC_MIN = 500, FC_MAX = 2500;
  var ATTAQUE_MIN = 0.005, CRETE_MAX = 0.5, EXTINCTION = 0.02;
  var ANTI_REBOND = 0.06, VOIX_MAX = 14, ATTENTE_MAX_MS = 600, ATTENTE_NB = 3;

  /* Lecture d'une tablette en mode silencieux (iPadOS 17+) : 'playback' fait jouer
     les sons malgre le mode silencieux ; le bouton haut-parleur du jeu reste le
     seul interrupteur. Mettre 'ambient' pour respecter le mode silencieux. */
  var SESSION_AUDIO = 'playback';

  var DUREE_MAX = { pop: 0.16, carte: 0.18, etape: 0.40, paire: 0.40, sceau: 0.70, victoire: 1.40 };

  /* ---- Partitions. t = depart (s), a = attaque (s), d = duree totale de la voix (s),
          g = crete, f0 -> f1 = glissando (Hz), fc0 -> fc1 = balayage du filtre (Hz),
          h = 1 : harmonique ajoutee a une fondamentale. ---- */
  var SONS = {
    // bulle qui monte : mi5 -> si5 glisse, avec son octave, 140 ms
    pop: [
      { type: 'osc', onde: 'sine', f0: 659.25,  f1: 987.77,  t: 0, a: 0.008, d: 0.14, g: 0.38 },
      { type: 'osc', onde: 'sine', f0: 1318.51, f1: 1975.53, t: 0, a: 0.008, d: 0.08, g: 0.10, h: 1 }
    ],
    // carte : souffle filtre haut-medium + petit appui do5 -> la4, 140 ms
    carte: [
      { type: 'bruit', filtre: 'bandpass', fc0: 1200, fc1: 2200, q: 1.0, t: 0, a: 0.012, d: 0.14, g: 0.30 },
      { type: 'osc', onde: 'triangle', f0: 523.25, f1: 440.00, t: 0, a: 0.006, d: 0.10, g: 0.16 }
    ],
    // etape : souffle doux + sol5 tres leger, decale de 50 ms pour ne pas s'empiler sur le pop
    etape: [
      { type: 'bruit', filtre: 'lowpass', fc0: 700, fc1: 1800, q: 0.7, t: 0.05, a: 0.10, d: 0.33, g: 0.30 },
      { type: 'osc', onde: 'sine', f0: 783.99, t: 0.05, a: 0.03, d: 0.30, g: 0.16 }
    ],
    // paire trouvee : do5 puis sol5 (quinte montante), 340 ms
    paire: [
      { type: 'osc', onde: 'sine', f0: 523.25,  t: 0,    a: 0.008, d: 0.20, g: 0.34 },
      { type: 'osc', onde: 'sine', f0: 1046.50, t: 0,    a: 0.008, d: 0.12, g: 0.10, h: 1 },
      { type: 'osc', onde: 'sine', f0: 783.99,  t: 0.10, a: 0.008, d: 0.24, g: 0.34 },
      { type: 'osc', onde: 'sine', f0: 1567.98, t: 0.10, a: 0.008, d: 0.14, g: 0.08, h: 1 }
    ],
    // sceau : carillon mi5 - sol5 - do6, 640 ms
    sceau: [
      { type: 'osc', onde: 'sine', f0: 659.25,  t: 0,    a: 0.006, d: 0.40, g: 0.26 },
      { type: 'osc', onde: 'sine', f0: 1318.51, t: 0,    a: 0.006, d: 0.20, g: 0.07, h: 1 },
      { type: 'osc', onde: 'sine', f0: 783.99,  t: 0.11, a: 0.006, d: 0.40, g: 0.26 },
      { type: 'osc', onde: 'sine', f0: 1567.98, t: 0.11, a: 0.006, d: 0.20, g: 0.06, h: 1 },
      { type: 'osc', onde: 'sine', f0: 1046.50, t: 0.22, a: 0.006, d: 0.42, g: 0.28 },
      { type: 'osc', onde: 'sine', f0: 2093.00, t: 0.22, a: 0.006, d: 0.20, g: 0.06, h: 1 }
    ],
    // victoire : arpege do5 mi5 sol5, puis accord do6 / sol5 / do5 tenu (remonte d'une
    // octave par rapport a la v1 : sol4 et do4 ne sortent pas d'un haut-parleur de tablette), 1,35 s
    victoire: [
      { type: 'osc', onde: 'sine', f0: 523.25,  t: 0,    a: 0.008, d: 0.26, g: 0.24 },
      { type: 'osc', onde: 'sine', f0: 1046.50, t: 0,    a: 0.008, d: 0.14, g: 0.05, h: 1 },
      { type: 'osc', onde: 'sine', f0: 659.25,  t: 0.13, a: 0.008, d: 0.26, g: 0.24 },
      { type: 'osc', onde: 'sine', f0: 1318.51, t: 0.13, a: 0.008, d: 0.14, g: 0.05, h: 1 },
      { type: 'osc', onde: 'sine', f0: 783.99,  t: 0.26, a: 0.008, d: 0.30, g: 0.25 },
      { type: 'osc', onde: 'sine', f0: 1567.98, t: 0.26, a: 0.008, d: 0.14, g: 0.05, h: 1 },
      { type: 'osc', onde: 'sine', f0: 1046.50, t: 0.40, a: 0.020, d: 0.95, g: 0.20 },
      { type: 'osc', onde: 'sine', f0: 783.99,  t: 0.40, a: 0.030, d: 0.95, g: 0.12 },
      { type: 'osc', onde: 'sine', f0: 523.25,  t: 0.40, a: 0.030, d: 0.95, g: 0.12 }
    ]
  };

  /* ---- Etat ---- */
  var ctx = null, bus = null, maitre = null, bruitBuf = null;
  var actives = 0, dernier = {}, attente = [];
  var muetLu = lire(CLE_MUET);
  var muetEtat = muetLu !== null ? muetLu === '1' : lire(CLE_MUET_V1) === '1';
  var volume = borne(parseFloat(lire(CLE_VOL)), VOL_DEFAUT);

  function lire(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function borne(v, defaut) { if (typeof v !== 'number' || isNaN(v)) return defaut; return Math.max(0, Math.min(VOL_MAX, v)); }
  function dB(x) { return x > 0 ? 20 * Math.log(x) / Math.LN10 : -Infinity; }

  /* ---- Garde-fou : identite jusqu'a 0,5 (-6 dBFS), arrondi au-dessus, plafond 0,75 ---- */
  function courbeGardeFou() {
    var n = 2048, c = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var x = (i / (n - 1)) * 2 - 1, ax = Math.abs(x), y;
      if (ax <= 0.5) y = ax;
      else { var u = (ax - 0.5) / 0.25, e2 = Math.exp(2 * u); y = 0.5 + 0.25 * ((e2 - 1) / (e2 + 1)); }
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }

  /* ---- Session audio de la tablette ---- */
  function sessionAudio() {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== SESSION_AUDIO) {
        navigator.audioSession.type = SESSION_AUDIO;
      }
    } catch (e) { /* non pris en charge : sans effet */ }
  }

  /* ---- Demarrage au premier toucher ---- */
  function construire() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    sessionAudio();
    ctx = new AC();
    bus = ctx.createGain(); bus.gain.value = 1;
    var passeBas = ctx.createBiquadFilter();
    passeBas.type = 'lowpass'; passeBas.frequency.value = 4000; passeBas.Q.value = 0;
    maitre = ctx.createGain();
    maitre.gain.value = muetEtat ? 0 : volume;
    var gardeFou = ctx.createWaveShaper();
    gardeFou.curve = courbeGardeFou(); gardeFou.oversample = 'none';
    bus.connect(passeBas); passeBas.connect(maitre); maitre.connect(gardeFou); gardeFou.connect(ctx.destination);
    bruitBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
    var dat = bruitBuf.getChannelData(0);
    for (var i = 0; i < dat.length; i++) dat[i] = Math.random() * 2 - 1;
    ctx.onstatechange = viderAttente;
  }

  function reprendre() {
    if (!ctx) return;
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
      try {
        var p = ctx.resume();
        if (p && typeof p.then === 'function') p.then(viderAttente, function () {});
      } catch (e) { /* rien */ }
    }
  }

  function deverrouiller() {
    try {
      if (!ctx) {
        construire();
        if (!ctx) return;
        // anciens iOS : un tampon muet joue pendant le geste deverrouille la sortie
        var s = ctx.createBufferSource();
        s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
        s.connect(ctx.destination); s.start(0);
      }
      sessionAudio();
      reprendre();
      viderAttente();
    } catch (e) { /* pas d'audio : le jeu reste muet, sans erreur */ }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, deverrouiller, { capture: true, passive: true });
  });

  /* ---- Moteur ---- */
  function enveloppe(g, t0, v) {
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v.g, t0 + v.a);
    g.gain.exponentialRampToValueAtTime(v.g * 0.1, t0 + v.d - EXTINCTION);
    g.gain.linearRampToValueAtTime(0, t0 + v.d);
  }

  function voix(v, t0) {
    var g = ctx.createGain(), src;
    if (v.type === 'osc') {
      src = ctx.createOscillator();
      src.type = v.onde;
      src.frequency.setValueAtTime(v.f0, t0);
      if (v.f1) src.frequency.exponentialRampToValueAtTime(v.f1, t0 + Math.min(0.06, v.d));
      src.connect(g);
    } else {
      src = ctx.createBufferSource();
      src.buffer = bruitBuf;
      var f = ctx.createBiquadFilter();
      f.type = v.filtre; f.Q.value = v.q;
      f.frequency.setValueAtTime(v.fc0, t0);
      f.frequency.exponentialRampToValueAtTime(v.fc1, t0 + v.d * 0.6);
      src.connect(f); f.connect(g);
    }
    enveloppe(g, t0, v);
    g.connect(bus);
    actives++;
    src.onended = function () { actives--; try { g.disconnect(); } catch (e) {} };
    src.start(t0);
    src.stop(t0 + v.d + 0.02);
  }

  function lancer(nom) {
    var now = ctx.currentTime;
    if (dernier[nom] !== undefined && now - dernier[nom] < ANTI_REBOND) return;
    var p = SONS[nom];
    if (actives + p.length > VOIX_MAX) return;
    dernier[nom] = now;
    var base = now + 0.01;
    try { p.forEach(function (v) { voix(v, base + v.t); }); } catch (e) { /* silence plutot qu'erreur */ }
  }

  function viderAttente() {
    if (!ctx || ctx.state !== 'running' || !attente.length) return;
    var liste = attente; attente = [];
    var maintenant = Date.now();
    liste.forEach(function (e) {
      if (!muetEtat && maintenant - e.quand <= ATTENTE_MAX_MS) lancer(e.nom);
    });
  }

  function jouer(nom) {
    if (muetEtat || !SONS[nom]) return;
    if (!ctx) deverrouiller();
    if (!ctx) return;
    if (ctx.state !== 'running') {
      for (var i = 0; i < attente.length; i++) if (attente[i].nom === nom) return;
      if (attente.length < ATTENTE_NB) attente.push({ nom: nom, quand: Date.now() });
      reprendre();
      return;
    }
    lancer(nom);
  }

  /* ---- Controle par code, sans oreille ---- */
  function env(v, t) {             // reproduit exactement enveloppe()
    var x = t - v.t, fin = v.d - EXTINCTION;
    if (x < 0 || x > v.d) return 0;
    if (x <= v.a) return v.g * x / v.a;
    if (x <= fin) return v.g * Math.pow(0.1, (x - v.a) / (fin - v.a));
    return v.g * 0.1 * (v.d - x) / EXTINCTION;
  }
  function cretePartition(nom) {   // borne haute : toutes les voix en phase, pas de 1 ms
    var p = SONS[nom], max = 0;
    for (var t = 0; t <= DUREE_MAX[nom] + 0.001; t += 0.001) {
      var s = 0;
      for (var i = 0; i < p.length; i++) s += env(p[i], t);
      if (s > max) max = s;
    }
    return max;
  }
  function mesurer() {
    var m = {};
    Object.keys(SONS).forEach(function (nom) {
      var c = cretePartition(nom);
      m[nom] = {
        crete: Math.round(c * 1000) / 1000,
        dBFS_defaut: Math.round(dB(c * VOL_DEFAUT) * 10) / 10,
        dBFS_max: Math.round(dB(c * VOL_MAX) * 10) / 10
      };
    });
    return m;
  }
  function verifier() {
    var ecarts = [];
    Object.keys(SONS).forEach(function (nom) {
      var fondamentales = SONS[nom].filter(function (v) { return v.type === 'osc' && !v.h; });
      SONS[nom].forEach(function (v, i) {
        var id = nom + '[' + i + ']';
        if (v.type === 'osc') {
          var lo = v.h ? F_MIN : F_MIN, hi = v.h ? H_MAX : F_MAX;
          [v.f0, v.f1 || v.f0].forEach(function (f) {
            if (f < lo || f > hi) ecarts.push(id + ' frequence ' + f + ' Hz hors [' + lo + ', ' + hi + ']');
          });
          if (v.h) {
            var porteuse = fondamentales.filter(function (o) { return o.t === v.t && Math.abs(o.f0 * 2 - v.f0) < 1; })[0];
            if (!porteuse) ecarts.push(id + ' harmonique sans fondamentale');
            else if (v.g >= porteuse.g) ecarts.push(id + ' harmonique plus forte que sa fondamentale');
          }
        } else {
          [v.fc0, v.fc1].forEach(function (f) {
            if (f < FC_MIN || f > FC_MAX) ecarts.push(id + ' filtre ' + f + ' Hz hors [' + FC_MIN + ', ' + FC_MAX + ']');
          });
        }
        if (v.a < ATTAQUE_MIN) ecarts.push(id + ' attaque ' + v.a + ' s < 5 ms');
        if (v.a >= v.d - EXTINCTION) ecarts.push(id + ' attaque trop longue pour la duree');
        if (v.g > CRETE_MAX) ecarts.push(id + ' crete ' + v.g + ' > 0,5');
        if (v.t + v.d > DUREE_MAX[nom] + 1e-9) ecarts.push(id + ' finit a ' + (v.t + v.d).toFixed(2) + ' s > ' + DUREE_MAX[nom] + ' s');
      });
      var c = cretePartition(nom), dDef = dB(c * VOL_DEFAUT), dMax = dB(c * VOL_MAX);
      if (dDef < DBFS_DEFAUT_MIN || dDef > DBFS_DEFAUT_MAX) ecarts.push(nom + ' crete ' + dDef.toFixed(1) + ' dBFS au volume par defaut, hors [-15, -10]');
      if (dMax > DBFS_PLAFOND) ecarts.push(nom + ' crete ' + dMax.toFixed(1) + ' dBFS au volume max > -6');
    });
    if (VOL_DEFAUT > VOL_MAX) ecarts.push('volume par defaut > plafond');
    return ecarts; // tableau vide = tous les seuils tenus
  }

  window.SonsV = {
    pop: function () { jouer('pop'); },
    carte: function () { jouer('carte'); },
    sceau: function () { jouer('sceau'); },
    paire: function () { jouer('paire'); },
    etape: function () { jouer('etape'); },
    victoire: function () { jouer('victoire'); },
    setVolume: function (v) {
      volume = borne(Number(v), VOL_DEFAUT);
      ecrire(CLE_VOL, String(volume));
      if (maitre && !muetEtat) maitre.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
      return volume;
    },
    muet: function (oui) {
      muetEtat = !!oui;
      ecrire(CLE_MUET, muetEtat ? '1' : '0');
      if (muetEtat) attente = [];
      if (maitre) maitre.gain.setTargetAtTime(muetEtat ? 0 : volume, ctx.currentTime, 0.02);
      return muetEtat;
    },
    estMuet: function () { return muetEtat; },
    verifier: verifier,
    mesurer: mesurer
  };
})();

</script>

<script>
/* ===================== OUTILS ===================== */
const app = document.getElementById('app');
const $ = id => document.getElementById(id);

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

/* contour d'un cachet de cire : un cercle aux bords irréguliers */
function cireD(cx, cy, r){ let d=''; for(let i=0;i<=72;i++){ const t=i/72*2*Math.PI, rr=r*(1+.06*Math.sin(14*t)*(.6+.4*Math.sin(3*t+1)));
  d+=(i?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1)+' ' } return d+'Z' }
function hasard(graine){ let s = graine; return () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296 }

document.addEventListener('pointerdown', ev => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const objet = b.classList.contains('flip') || b.classList.contains('tiroir') || b.classList.contains('main-b');
  if (!objet) son('pop');
  b.classList.remove('rebond'); void b.offsetWidth; b.classList.add('rebond');
  b.addEventListener('animationend', () => b.classList.remove('rebond'), { once:true });
  if (calme() || objet) return;
  if (getComputedStyle(b).position === 'static') b.style.position = 'relative';
  b.style.overflow = 'hidden';
  const r = b.getBoundingClientRect(), h = document.createElement('span');
  h.className = 'halo-t'; h.style.left = (ev.clientX - r.left) + 'px'; h.style.top = (ev.clientY - r.top) + 'px';
  b.appendChild(h); setTimeout(() => h.remove(), 750);
}, { passive:true });
function celebrer(el, n=14, verte=false){
  if (!el || calme()) return;
  const r = el.getBoundingClientRect();
  for (let i=0; i<n; i++){
    const p = document.createElement('span');
    p.className = 'particule' + (verte ? ' verte' : '');
    p.style.left = (r.left + window.scrollX + r.width*(.15 + Math.random()*.7)) + 'px';
    p.style.top = (r.top + window.scrollY + r.height*(.3 + Math.random()*.5)) + 'px';
    p.style.setProperty('--dx', (Math.random()*120 - 60).toFixed(0) + 'px');
    p.style.setProperty('--dy', (-50 - Math.random()*90).toFixed(0) + 'px');
    p.style.animationDelay = (Math.random()*.3).toFixed(2) + 's';
    document.body.appendChild(p); setTimeout(() => p.remove(), 1600);
  }
}
function briller(el){ if (!el) return; el.classList.remove('brille'); void el.offsetWidth; el.classList.add('brille'); setTimeout(() => el.classList.remove('brille'), 1100) }

/* ===================== LE PLAN DE L'ARCHIVE : une coupe, cinq salles qui descendent, le couloir, l'étagère au fond ===================== */
const SAL = { 1:[80,112], 2:[220,197], 3:[80,282], 4:[220,367], 5:[80,452] };
const PT = n => n === 0 ? [150,64] : [SAL[n][0], SAL[n][1]+22];
const LEGS = { 1:"M150 64 C 150 100, 112 134, 80 134", 2:"M80 134 C 160 134, 140 219, 220 219", 3:"M220 219 C 140 219, 160 304, 80 304",
  4:"M80 304 C 160 304, 140 389, 220 389", 5:"M220 389 C 140 389, 160 474, 80 474" };
function etagereFond(){
  const r = hasard(5066), coul = ['#7A3B2E','#2F4A6B','#5B6B3A','#8A6A2F','#4E3A5E','#9A5A2A','#3D5B5B']; let h = '', x = 24;
  for (let i=0; i<66; i++){ const w = 3.82, bh = 26 + r()*16; h += `<rect x="${x.toFixed(2)}" y="${(556-bh).toFixed(1)}" width="${(w-.7).toFixed(2)}" height="${bh.toFixed(1)}" rx=".8" fill="${coul[Math.floor(r()*7)]}"/>`; x += w }
  return h;
}
function rPlateau(){

      ${S.st[n-1] ? `<path d="${cireD(x+100, y+50, 12)}" fill="url(#g-cire-or)" stroke="#8A5E12" stroke-width="1.2"/><text x="${x+100}" y="${y+55}" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5A3A08">${n}</text>` : ''}
      <text x="${lx}" y="${cy-4}" text-anchor="${gauche?'start':'end'}" font-family="Verdana, sans-serif" font-size="12" style="fill:var(--txt2)">Salle ${n}</text>

      ${n===3 && S.scelle && !S.pliOuvert ? `<use href="#i-cachet" x="${lx}" y="${cy+21}" width="22" height="22"/><text x="${lx+26}" y="${cy+37}" font-family="Verdana, sans-serif" font-size="12" style="fill:var(--cire-t)">Pli scellé</text>` : ''}
    </g>` };

      <path d="M8 40 H292" style="stroke:var(--salle-offb)" stroke-width="2"/>

      ${S.pos>0 ? `<path d="${Object.entries(LEGS).filter(([n])=>+n<=S.pos).map(([,d])=>d).join(' ')}" fill="none" stroke="#E0B356" stroke-width="5" stroke-linecap="round"/>` : ''}

      <g style="opacity:${S.vol?1:.45}">${etagereFond()}<rect x="18" y="556" width="264" height="6" rx="2" style="fill:var(--etag)"/></g>

      ${S.pos>0 && S.pos<5 ? `<button class="btn" id="revoir">Revoir la salle ${S.pos}</button>` : ''}

  const b = $('suivant'); if (b) b.onclick = () => { b.disabled = true; avancer() };
  const r = $('rouvrir'); if (r) r.onclick = () => { if (S.faites.includes(5)) S.et[5] = 0; aller('niv5') };
  const v = $('revoir'); if (v) v.onclick = () => { S.et[S.pos] = 0; aller('niv'+S.pos) };
  S.st.forEach((o,i) => { if (o && !(S.vues||[])[i]){ const g = document.querySelectorAll('.salle')[i]; setTimeout(()=>{ celebrer(g, 10); son('sceau') }, 500) } });

function avancer(){
  const a = S.pos+1, leg = $('leg'+a), pion = $('pion'), L = leg.getTotalLength(), D = calme() ? 1 : 1000;
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2, t0 = performance.now();
  function pas(now){
    const t = Math.min(1,(now-t0)/D), p = leg.getPointAtLength(ease(t)*L);
    pion.setAttribute('transform', `translate(${p.x} ${p.y})`);
    if (t<1) requestAnimationFrame(pas);
    else { S.pos = a; S.et[a] = 0; save(); setTimeout(()=>aller('niv'+a), calme()?0:400) }

/* ----- la voûte : un tiroir DANGER, puis le tiroir PROTECTION qui lui répond ----- */
let selD = null, tiOccupe = false;
function brancherTiroirs(){
  selD = null; tiOccupe = false;
  const tir = (g, i) => document.querySelector(`.tiroir[data-g="${g}"][data-i="${i}"]`);
  document.querySelectorAll('.tiroir').forEach(b => b.onclick = () => {
    const g = b.dataset.g, i = +b.dataset.i; if (tiOccupe || S.tir.ok.includes(i)) return;
    if (g === 'd'){
      if (selD !== null && selD !== i) tir('d', selD).classList.remove('ouvert');
      selD = i; b.classList.add('ouvert'); son('carte'); $('tiEtat').textContent = 'Trouve le tiroir PROTECTION qui lui répond.';
      return;
    }
    if (selD === null){ $('tiEtat').textContent = 'Ouvre d\'abord un tiroir DANGER.'; return }
    tiOccupe = true; b.classList.add('ouvert'); son('carte'); const d = selD;
    if (i === d){
      setTimeout(()=>{ S.tir.ok.push(i); save(); b.classList.add('ok'); tir('d', d).classList.add('ok'); son('paire');
        celebrer(b, 8, true); selD = null; tiOccupe = false;
        $('tiEtat').textContent = S.tir.ok.length === 2 ? 'Les quatre tiroirs sont ouverts.' : 'Ouvre l\'autre tiroir DANGER.';
        if (S.tir.ok.length === 2) pret() }, calme()?0:800);
    } else {
      /* paire fausse : les deux tiroirs se referment doucement, sans marque d'erreur */
      setTimeout(()=>{ b.classList.remove('ouvert'); tir('d', d).classList.remove('ouvert'); selD = null; tiOccupe = false;
        $('tiEtat').textContent = 'Ouvre un tiroir DANGER.' }, calme()?600:2600);
    }
  });
}

/* ----- la dictée : au clavier, ou au doigt ----- */
function brancherDictee(){
  
  $('mClav').onclick = () => { S.dict.mode = 'clavier'; save(); rNiv(N) };
  $('mDoigt').onclick = () => { const t = $('champD'); if (t) S.dict.txt = t.value; S.dict.mode = 'doigt'; save(); rNiv(N) };
  const t = $('champD'); if (t) t.oninput = () => { S.dict.txt = t.value; save() };
  let trace = false;
  const cv = $('dessin');
  if (cv){
    /* taille de mise en page (offsetWidth), insensible à l'animation d'entrée de l'écran */
    const k = window.devicePixelRatio || 1, r = { width:cv.offsetWidth, height:cv.offsetHeight };
    cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
    const c = cv.getContext('2d'); c.scale(k, k); c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#1E2F57';
    c.fillStyle = '#FBF3E2'; c.fillRect(0, 0, r.width, r.height);
    let bas = false;
    const pt = ev => { const b = cv.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top] };
    cv.onpointerdown = ev => { bas = true; cv.setPointerCapture(ev.pointerId); const [x,y] = pt(ev); c.beginPath(); c.moveTo(x,y); c.lineTo(x+.1,y+.1); c.stroke(); trace = true };
    cv.onpointermove = ev => { if (!bas) return; const [x,y] = pt(ev); c.lineTo(x,y); c.stroke() };
    cv.onpointerup = cv.onpointercancel = () => { bas = false };
    $('effacer').onclick = () => { c.fillRect(0, 0, r.width, r.height); trace = false };
  }
  $('ecrit').onclick = () => {
    if (S.dict.mode === 'doigt'){ if (!trace) return; S.dict.img = cv.toDataURL('image/png') }
    else { const v = ($('champD').value || '').trim(); if (!v){ $('champD').focus(); return } S.dict.txt = v; S.dict.img = '' }
    document.activeElement.blur(); S.dict.fait = true; save(); son('sceau'); rNiv(N);
  };
}

  const m = window.SonsV ? SonsV.estMuet() : true;
  $('hpOn').style.display = m ? 'none' : ''; $('hpOff').style.display = m ? '' : 'none';
  $('btnHP').setAttribute('aria-label', m ? 'Son coupé' : 'Son activé');
}
$('btnHP').onclick = () => { if (window.SonsV) SonsV.muet(!SonsV.estMuet()); majHP() };
majHP();
$('btnReset').onclick = () => $('confirm').hidden = false;
$('nonReset').onclick = () => $('confirm').hidden = true;
$('ouiReset').onclick = () => { S = neuf(); save(); $('confirm').hidden = true; render(); window.scrollTo(0,0) };

render();
</script>
</body>
