<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opération SIGNAL</title>


<!--
  Opération SIGNAL, leçon 04 — version famille, à rejouer à la maison.
  Une seule chose à lire par écran. Aucune vibration, aucun clignotement, aucun compte à rebours. Tout mouvement
  s'arrête si l'appareil demande « moins de mouvement ». Son : module de Milo (sons.js), inclus tel quel.
  Aucune ressource externe, aucune image extérieure. L'état est gardé dans le navigateur ; « Recommencer » l'efface.
-->

<style>
:root{
  color-scheme: light;
  --bg:#E8EEF8; --bg2:#D9E2F2; --panneau:#F7F9FD; --panneau-b:#C6D0E4; --line:#AEBBD6;
  --txt:#1B2340; --txt2:#43517A; --glace-t:#1D6496; --or-t:#7A570B; --violet-t:#5A44AE; --vert-t:#1C6E52;
  --route:#C6D0E6; --off:#DCE3F0; --offl:#7F8DAE;
  --etoile-fond:rgba(52,64,120,.38); --neb1:rgba(140,120,220,.20); --neb2:rgba(80,170,215,.18);
  --planete1:#CBD7F1; --planete2:#A3B5DE; --anneau:rgba(70,90,150,.28);
  --creme:#FFF8E8; --encre:#1B2340; --creme-b:#E3D3AE; --ref:#6A5420;
  --titre-f: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
  --lire-f: Verdana, 'Atkinson Hyperlegible', Tahoma, 'Segoe UI', system-ui, sans-serif;
}
/* thème sombre, au choix : bleu nuit profond, jamais noir pur */
html[data-theme="sombre"]{
  color-scheme: dark;
  --bg:#131B33; --bg2:#1A2444; --panneau:#212C50; --panneau-b:#36446F; --line:#43528A;
  --txt:#EEF2FB; --txt2:#B7C3DE; --glace-t:#8FD0F2; --or-t:#F2CE78; --violet-t:#BDAEF7; --vert-t:#86DDBD;
  --route:#27335B; --off:#26315A; --offl:#6170A0;
  --etoile-fond:rgba(232,238,255,.62); --neb1:rgba(150,120,240,.16); --neb2:rgba(80,170,220,.13);
  --planete1:#2E3D70; --planete2:#1E2852; --anneau:rgba(150,180,240,.25);
}
*{ box-sizing:border-box }
html,body{ margin:0; color:var(--txt); font-family:var(--lire-f); -webkit-tap-highlight-color:transparent }
html{ background:var(--bg) }
body{ min-height:100dvh; background:linear-gradient(180deg, var(--bg), var(--bg2));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px) }
button{ font:inherit; color:inherit }
[hidden]{ display:none !important }

/* ---------- décor : une station en orbite, vivante mais lente ---------- */
.decor{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden }
.decor .neb{ position:absolute; border-radius:50%; filter:blur(40px); animation:respire 18s ease-in-out infinite alternate }
.decor .n1{ width:70vmax; height:50vmax; left:-20vmax; top:-18vmax; background:radial-gradient(closest-side, var(--neb1), transparent) }
.decor .n2{ width:60vmax; height:44vmax; right:-22vmax; top:30vh; background:radial-gradient(closest-side, var(--neb2), transparent); animation-duration:23s; animation-delay:-8s }
.decor .champ{ position:absolute; inset:-6%; width:112%; height:112% }
.decor .c1{ animation:derive 150s ease-in-out infinite alternate }
.decor .c2{ animation:derive2 210s ease-in-out infinite alternate }
.decor .champ circle{ fill:var(--etoile-fond) }
.decor .planete{ position:absolute; width:58vmin; height:58vmin; right:-20vmin; bottom:-26vmin; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--planete1), var(--planete2) 70%); opacity:.85 }
.decor .anneau{ position:absolute; left:-24%; right:-24%; top:42%; height:16%; border-radius:50%; border:2px solid var(--anneau); transform:rotate(-14deg) }
.decor .orbite{ position:absolute; width:86vmin; height:86vmin; right:-34vmin; bottom:-40vmin; animation:tourne 120s linear infinite }
.decor .sat{ position:absolute; left:50%; top:0; width:7px; height:7px; margin-left:-3px; border-radius:50%; background:var(--glace-t); opacity:.55 }
@keyframes respire{ from{ opacity:.55 } to{ opacity:1 } }
@keyframes derive{ from{ transform:translate(0,0) } to{ transform:translate(-2.5%, 1.5%) } }
@keyframes derive2{ from{ transform:translate(0,0) } to{ transform:translate(2%, -2%) } }
@keyframes tourne{ to{ transform:rotate(360deg) } }

/* ---------- barre du haut ---------- */
.top{ position:relative; z-index:2; display:flex; align-items:center; gap:10px; height:64px; margin-top:env(safe-area-inset-top, 0px) }
.top .mini{ display:flex; align-items:center; gap:8px; opacity:0; transition:opacity 1s ease; min-width:0; flex:1 }
.top .mini.on{ opacity:1 }
.top .mini svg{ width:40px; height:40px; flex:none }
.top .mini span{ font-family:var(--titre-f); font-size:16px; font-weight:700; color:var(--glace-t); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.top .nom{ font-family:var(--titre-f); font-size:17px; font-weight:700; letter-spacing:.06em; color:var(--txt2); white-space:nowrap; padding-right:4px }
.top .reset{ min-height:48px; padding:0 14px; border:1px solid var(--line); background:var(--panneau); border-radius:12px; font-size:15px; font-weight:700; color:var(--txt2); cursor:pointer }
@media (max-width:480px){ .top .nom{ display:none } .top .reset{ padding:0 10px; font-size:14px } }
.slot-hp{ display:inline-flex; align-items:center; flex:none; gap:2px }
.hp{ width:48px; height:48px; border:0; background:transparent; color:var(--txt2); border-radius:12px; display:grid; place-items:center; cursor:pointer; padding:0 }
.hp svg{ width:28px; height:28px }
.confirm{ position:fixed; left:0; right:0; top:0; z-index:30; background:var(--panneau); color:var(--txt); border-bottom:1px solid var(--panneau-b);
  padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:19px; box-shadow:0 8px 30px rgba(10,20,50,.2) }
.confirm span{ flex:1 1 220px }

/* ---------- mouvement : doux, une seconde au plus, rien qui clignote ---------- */
#app{ position:relative; z-index:1 }
.screen{ animation:entree .6s cubic-bezier(.2,.8,.2,1) both }
@keyframes entree{ from{ opacity:0; transform:scale(.985) } to{ opacity:1; transform:none } }
@keyframes fondu{ from{ opacity:0 } to{ opacity:1 } }
.halo-t{ position:absolute; border-radius:50%; pointer-events:none; width:16px; height:16px; margin:-8px 0 0 -8px;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(143,208,242,.28) 60%, transparent 70%); animation:halo .7s ease-out forwards; z-index:3 }
@keyframes halo{ from{ transform:scale(1); opacity:1 } to{ transform:scale(9); opacity:0 } }
.rebond{ animation:rebond .45s cubic-bezier(.3,1.6,.5,1) }
@keyframes rebond{ 0%{ transform:scale(1) } 40%{ transform:scale(.95) } 100%{ transform:scale(1) } }
.brille{ position:relative; overflow:hidden }
.brille::after{ content:""; position:absolute; top:-20%; bottom:-20%; left:-60%; width:45%; transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,246,200,.7), transparent); animation:balaye 1s ease-out forwards; pointer-events:none }
@keyframes balaye{ from{ left:-60% } to{ left:120% } }
.particule{ position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:40;
  background:radial-gradient(circle, #FFF6C8, #FFD25E 60%, rgba(255,210,94,0) 70%); animation:monte 2.2s ease-out forwards }
.particule.verte{ background:radial-gradient(circle, #E6FFF4, #7FD9B8 60%, rgba(127,217,184,0) 70%) }
@keyframes monte{ 0%{ opacity:0; transform:translate(0,0) scale(.6) } 15%{ opacity:1 } 100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1) } }

/* ---------- boutons ---------- */
.big{ display:inline-flex; align-items:center; justify-content:center; gap:12px; min-height:76px; min-width:76px; padding:0 30px;
  border-radius:20px; border:2px solid #8FD0F2; background:linear-gradient(180deg,#22679A,#174B70); color:#FFFFFF;
  font-family:var(--titre-f); font-size:24px; font-weight:700; letter-spacing:.03em; cursor:pointer;
  box-shadow:0 0 0 5px rgba(143,208,242,.18), 0 8px 22px rgba(10,25,60,.25); transition:transform .3s ease }
.big:active{ transform:translateY(2px) }
.big svg{ width:34px; height:34px; flex:none }
.big.or{ border-color:#FFD98A; background:linear-gradient(180deg,#94690F,#6E4E0B); box-shadow:0 0 0 5px rgba(255,210,94,.22), 0 8px 22px rgba(10,25,60,.25) }
.big.violet{ border-color:#C9BAFF; background:linear-gradient(180deg,#5D47B5,#45338C); box-shadow:0 0 0 5px rgba(189,174,247,.22), 0 8px 22px rgba(10,25,60,.25) }
.big[disabled]{ opacity:.45 }
.btn{ min-height:58px; padding:0 20px; border-radius:16px; border:2px solid var(--line); background:var(--panneau); color:var(--txt);
  font-family:var(--lire-f); font-size:18px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px }
.btn svg{ width:24px; height:24px; flex:none }
.btn.on{ border-color:#3FAF86; background:#E4F6EE; color:#164F3B }
.btn.leger{ border-color:transparent; background:transparent; color:var(--txt2); font-weight:700 }
.row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center }

/* ---------- une scène = une chose à lire ---------- */
.scene{ min-height:calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; align-items:center; gap:22px; padding:6px 0 28px }
.scene .haut{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100% }
.hud{ font-family:var(--titre-f); font-size:17px; font-weight:700; letter-spacing:.06em; color:var(--glace-t); margin:0; text-align:center }
.pas{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:100% }
.pas i{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--offl); display:block; transition:background .8s ease }
.pas i.fait{ background:var(--offl) }
.pas i.ici{ background:var(--or-t); border-color:var(--or-t) }
.milieu{ flex:1; width:100%; max-width:680px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; min-width:0 }
.bas{ width:100%; max-width:680px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between }
.bas .big{ margin-left:auto }

/* panneau de lecture : fond doux, jamais d'étoiles derrière un mot */
.panneau{ width:100%; background:var(--panneau); border:1px solid var(--panneau-b); border-radius:24px; padding:30px 32px; min-width:0;
  box-shadow:0 10px 34px rgba(15,25,70,.10) }
.question{ font-family:var(--lire-f); font-size:28px; line-height:1.6; letter-spacing:.02em; word-spacing:.1em; margin:0; color:var(--txt); max-width:24em }
.phrase{ font-family:var(--lire-f); font-size:27px; line-height:1.6; letter-spacing:.02em; word-spacing:.1em; margin:0; color:var(--txt) }
.phrase.petite{ font-size:22px; color:var(--txt2) }
.aide-btn{ margin-top:22px; min-height:48px; padding:0 16px; border-radius:12px; border:1.5px dashed var(--glace-t); background:transparent; color:var(--glace-t);
  font-size:16px; font-weight:700; cursor:pointer }
.aide{ margin:20px 0 0; font-size:20px; line-height:1.6; letter-spacing:.02em; color:var(--txt2); animation:fondu .6s ease both }
/* le verset : panneau crème, texte bleu nuit, dans les deux thèmes */
.lire{ width:100%; background:var(--creme); color:var(--encre); border:1px solid var(--creme-b); border-radius:24px; padding:30px 34px; min-width:0;
  box-shadow:0 10px 34px rgba(15,25,70,.12) }
.lire .ref{ font-family:var(--titre-f); font-size:19px; font-weight:700; letter-spacing:.04em; color:var(--ref); margin:0 0 14px }
.lire .frag{ font-family:var(--lire-f); font-size:28px; line-height:1.7; letter-spacing:.03em; word-spacing:.12em; margin:0; max-width:22em; animation:fondu .6s ease both }
.lire .refrain{ font-family:var(--lire-f); font-size:24px; line-height:1.6; letter-spacing:.03em; color:#7A570B; font-weight:700; margin:18px 0 0; animation:fondu .8s ease both }
.lecteur{ display:flex; align-items:center; gap:10px; justify-content:center }
.lecteur svg{ width:30px; height:30px }
.lecteur b{ font-family:var(--titre-f); font-size:15px; color:var(--txt2); min-width:2.6em }
.livre{ display:flex; align-items:center; gap:10px; margin:0; font-size:17px; line-height:1.5; color:var(--txt2); text-align:left;
  background:var(--panneau); border:1px solid var(--panneau-b); border-radius:14px; padding:10px 16px; max-width:30em }
.livre svg{ width:30px; height:30px; flex:none }
.video{ display:flex; gap:18px; align-items:center }
.video svg{ width:64px; height:64px; flex:none }
.video .vt{ margin:0 0 6px; font-family:var(--titre-f); font-size:17px; font-weight:700; color:var(--glace-t) }
img.lff{ display:block; width:100%; height:auto; border-radius:18px; border:1px solid var(--panneau-b) }
img.vignette{ max-width:360px; margin:0 auto }
img.haute{ max-height:34vh; width:auto; max-width:100%; margin:0 auto }
.champ, textarea.champ{ width:100%; border-radius:14px; border:1.5px solid var(--line); padding:14px 16px; font-family:var(--lire-f); font-size:21px;
  background:#FFFFFF; color:#1B2340; letter-spacing:.02em }
textarea.champ{ min-height:96px; resize:vertical }
.liste{ margin:16px 0 0; padding-left:22px; font-size:19px; line-height:1.6 }
/* repli pour l'adulte : fermé par défaut */
details.repli{ width:100%; max-width:680px; border-radius:14px; border:1px dashed var(--panneau-b); background:var(--panneau); opacity:.95 }
details.repli summary{ list-style:none; cursor:pointer; min-height:48px; display:flex; align-items:center; gap:8px; padding:0 16px;
  font-family:var(--titre-f); font-size:15px; font-weight:700; color:var(--txt2) }
details.repli summary::-webkit-details-marker{ display:none }
.repli-c{ padding:0 18px 16px; font-size:17px; line-height:1.55; color:var(--txt) }
.repli-c p{ margin:0 0 10px }
.repli-c b{ color:var(--glace-t) }

/* ---------- accueil, badge, signal crypté ---------- */
.centre{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center;
  min-height:calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); padding:8px 0 28px }
.titre{ font-family:var(--titre-f); font-size:clamp(42px, 8vw, 74px); font-weight:800; letter-spacing:.05em; margin:0; color:var(--txt);
  text-shadow:0 0 22px rgba(143,208,242,.45) }
.sous{ font-family:var(--lire-f); font-size:clamp(20px, 3.4vw, 26px); color:var(--txt2); margin:-10px 0 0 }
.hublot{ position:relative; width:min(92vw, 720px); aspect-ratio:1200/324; border-radius:999px; overflow:hidden; background:#0E1630;
  border:6px solid #8E9EC4; box-shadow:0 0 0 3px #CBD5EB, 0 0 0 9px rgba(143,208,242,.18), inset 0 0 30px rgba(0,0,0,.5) }
.hublot img, .hublot > svg{ display:block; width:100%; height:100%; object-fit:cover; border:0; border-radius:0 }
.pulse{ position:absolute; left:73%; top:40%; width:14px; height:14px; margin:-7px; border-radius:50%; background:#FFE9A8; box-shadow:0 0 12px 4px rgba(255,220,140,.7) }
.pulse::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid rgba(255,233,168,.9); animation:onde 1s ease-out .6s both }
@keyframes onde{ from{ transform:scale(.6); opacity:1 } to{ transform:scale(5); opacity:0 } }
.badge{ position:relative; width:min(90vw, 470px); aspect-ratio:85.6/54; border-radius:20px; text-align:left; color:#FFFFFF;
  background:linear-gradient(135deg,#1F2B55,#2B3C78 60%,#203A66); border:2px solid #8FD0F2; padding:5% 6%; overflow:hidden;
  box-shadow:0 0 0 6px rgba(143,208,242,.15), 0 14px 34px rgba(10,20,50,.35) }
.badge .b-ent{ font-family:var(--titre-f); font-weight:700; letter-spacing:.08em; font-size:clamp(14px,2.4vw,18px); color:#8FD0F2 }
.badge .b-corps{ display:flex; gap:5%; margin-top:6%; align-items:center }
.badge .b-av{ width:26%; aspect-ratio:1; flex:none }
.badge .b-lig{ font-size:clamp(13px,2vw,16px); color:#C9D4EE; margin:0 0 6px }
.badge .b-val{ font-family:var(--titre-f); font-weight:800; font-size:clamp(22px,4vw,32px); margin:0; word-break:break-word }
.tampon{ position:absolute; right:5%; bottom:8%; padding:6px 14px; border:3px solid #7FD9B8; border-radius:12px; color:#9FF0CF; background:rgba(20,30,60,.6);
  font-family:var(--titre-f); font-weight:800; font-size:clamp(15px,2.8vw,21px); transform:rotate(-6deg) scale(1.5); opacity:0; transition:transform .9s ease, opacity .9s ease }
.tampon.on{ transform:rotate(-6deg) scale(1); opacity:1 }
.crypto{ width:100%; border-radius:22px; padding:28px 30px; background:#2A2152; border:2px solid #8C7AE0; color:#D9CEFF;
  font-family:Consolas, 'Courier New', monospace; font-size:26px; line-height:1.6; letter-spacing:.12em; word-break:break-all; text-align:left;
  box-shadow:0 0 0 6px rgba(189,174,247,.16) }
.crypto.clair{ background:var(--creme); color:var(--encre); border-color:var(--creme-b); font-family:var(--lire-f); letter-spacing:.03em; word-break:normal; box-shadow:none }
.verrou{ display:flex; align-items:center; gap:12px; justify-content:center }
.verrou svg{ width:54px; height:54px }

/* ---------- carte du ciel ---------- */
.plateau{ display:grid; gap:14px; height:max(600px, calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px));
  grid-template-rows:minmax(330px,1fr) auto; padding-bottom:12px }
.plateau .board{ min-height:0; display:flex; justify-content:center }
.plateau .board svg{ width:100%; height:100%; max-width:600px }
.plateau .side{ display:flex; flex-direction:column; gap:12px; align-items:stretch; width:100%; max-width:520px; margin:0 auto }
.plateau .side .big{ width:100% }
@media (orientation:landscape) and (min-width:700px){
  .plateau{ grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr) 300px }
  .plateau .side{ justify-content:center }
}
.noeud.on path.e{ filter:drop-shadow(0 0 5px rgba(255,210,94,.9)) }
.etat{ font-family:var(--titre-f); font-size:17px; font-weight:700; color:var(--txt2); text-align:center; margin:0 }
.mini-verrou{ display:flex; align-items:center; gap:10px; justify-content:center; margin:0; font-size:16px; color:var(--violet-t); font-weight:700; text-align:left }
.mini-verrou svg{ width:38px; height:38px; flex:none }

/* ---------- niveaux ---------- */
.rond{ position:relative; width:min(62vw, 300px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 40%, #2C3D72, #141C3A 72%); border:6px solid #8E9EC4;
  box-shadow:0 0 0 3px #CBD5EB, 0 0 0 10px rgba(143,208,242,.16) }
.rond > svg.pic{ width:52%; height:52% }
.rond img{ width:100%; height:100%; object-fit:cover; border:0; border-radius:0 }
.rond > svg:not(.pic){ position:absolute; inset:0; width:100%; height:100% }
.nom-niv{ font-family:var(--titre-f); font-size:clamp(28px,5vw,40px); font-weight:800; letter-spacing:.08em; margin:0; color:var(--txt); text-align:center }
.emet .ondes path{ opacity:0; animation:emission 1s ease-out .5s forwards }
.emet .ondes path:nth-child(2){ animation-delay:.7s } .emet .ondes path:nth-child(3){ animation-delay:.9s }
@keyframes emission{ from{ opacity:0; transform:scale(.7) } to{ opacity:1; transform:none } }
.emet .ondes{ transform-origin:32px 26px }
.g-etoile{ width:min(56vw, 230px); height:auto; overflow:visible }
.g-etoile .e{ transition:fill 1s ease, stroke 1s ease, filter 1s ease }
.g-etoile.on .e{ filter:drop-shadow(0 0 14px rgba(255,210,94,.9)) }
.coeur{ width:min(34vw, 130px); height:auto }

/* cartes de l'observatoire */
.rang-lab{ font-family:var(--titre-f); font-size:17px; font-weight:800; letter-spacing:.06em; margin:0; align-self:flex-start }
.rang-lab.or{ color:var(--or-t) } .rang-lab.glace{ color:var(--glace-t) }
.rang{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; width:100% }
.carte{ border:0; background:none; padding:0; perspective:900px; cursor:pointer; min-width:0; aspect-ratio:5/7; width:100% }
.carte .in{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s ease }
.carte.ouverte .in{ transform:rotateY(180deg) }
.carte .f{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px; padding:10px 8px }
.carte .dos{ justify-content:center }
.carte.A .dos{ background:radial-gradient(circle at 50% 40%, #FFF0C4, #EDC66C 72%, #D9A946); border:3px solid #F7DFA0 }
.carte.V .dos{ background:radial-gradient(circle at 50% 40%, #E2F4FD, #92CDEB 72%, #6FB3DA); border:3px solid #CFEAF8 }
.carte .dos svg{ width:62%; height:auto }
.carte .k{ font-family:var(--titre-f); font-weight:800; letter-spacing:.04em; font-size:14px; color:#1B2340 }
.carte .face{ transform:rotateY(180deg); background:#FBFCFE; color:#1B2340 }
.carte.A .face{ border:3px solid #D9A946 } .carte.V .face{ border:3px solid #6FB3DA; justify-content:center }
.carte .face svg{ width:40%; height:auto; flex:none }
.carte .face .t{ font-family:var(--lire-f); font-size:14px; font-weight:400; line-height:1.4; letter-spacing:.01em; text-align:center; margin:0 }
.carte .face .vr{ font-family:var(--lire-f); font-size:17px; font-weight:700; line-height:1.4; text-align:center; margin:0 }
.carte.ok .face{ border-color:#3FAF86; background:#E7F7F0; box-shadow:0 0 18px rgba(127,217,184,.8) }
.carte .conf{ font-family:var(--titre-f); font-size:12.5px; font-weight:800; color:#16624A; opacity:0; transition:opacity .9s ease; margin-top:auto; text-align:center }
.carte.ok .conf{ opacity:1 }
@media (orientation:landscape) and (min-width:700px) and (max-height:900px){ .carte{ aspect-ratio:4/5 } .rang{ max-width:640px; margin:0 auto } .carte .face svg{ width:30% } }
.voile{ position:fixed; inset:0; z-index:25; background:rgba(12,18,40,.55); display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation:fondu .4s ease both }
.voile{ background:rgba(12,18,40,.8) }
.voile .boite-v{ width:100%; max-width:680px; display:flex; flex-direction:column; gap:20px; align-items:center; max-height:100%; overflow:auto;
  background:var(--bg); border:1px solid var(--panneau-b); border-radius:28px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.35) }

/* tri du décodeur */
.tri{ width:100%; display:flex; flex-direction:column; align-items:center; gap:26px }
.pile{ min-height:150px; display:flex; align-items:center; justify-content:center; width:100% }
.mot{ position:relative; display:flex; align-items:center; gap:16px; width:min(84vw, 340px); padding:16px 22px; border-radius:18px; background:#FBFCFE; color:#1B2340;
  border:3px solid #8E9EC4; box-shadow:0 10px 26px rgba(15,25,70,.2); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none }
.mot.tenu{ cursor:grabbing; box-shadow:0 18px 40px rgba(15,25,70,.3); z-index:5 }
.mot svg{ width:58px; height:58px; flex:none }
.mot .w{ font-family:var(--lire-f); font-size:28px; font-weight:700; margin:0 }
.mot .r{ font-family:var(--lire-f); font-size:15px; color:#43517A; margin:4px 0 0 }
.tiroirs{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:14px; width:100% }
.tiroir{ min-height:170px; border-radius:20px; border:3px dashed var(--line); background:var(--panneau); display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; cursor:pointer }
.tiroir.nom{ border-color:#C9A146 }
.tiroir .t-nom{ font-family:var(--titre-f); font-size:22px; font-weight:800; letter-spacing:.1em; color:var(--txt2) }
.tiroir.nom .t-nom{ color:var(--or-t) }
.t-contenu{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center }
.puce{ padding:6px 12px; border-radius:999px; background:#E3EBF8; color:#1B2340; font-size:16px; font-weight:700; animation:fondu .5s ease both }
.puce.or{ background:#FFE7A8 }
@media (max-width:520px){ .tiroirs{ grid-template-columns:1fr 1fr } .tiroir{ min-height:150px } }

/* arrimage, constellation, capsule */
.ciel{ width:100%; border-radius:22px; background:radial-gradient(ellipse at 50% 30%, #24346A, #121A38 75%); border:1px solid #3A4A80; overflow:hidden }
.ciel svg{ display:block; width:100%; height:auto }
.dock .vais{ transition:transform 1s cubic-bezier(.3,.7,.3,1) }
.dock .stat{ transition:transform 1s cubic-bezier(.3,.7,.3,1) }
.dock.pas1 .vais{ transform:translateX(64px) }
.dock.pas2 .stat{ transform:translateX(-64px) }
.dock .joint{ opacity:0; transition:opacity .8s ease }
.dock.ok .joint{ opacity:1 }
.constel .lien{ stroke-dasharray:400; stroke-dashoffset:400 }
.constel.on .lien{ stroke-dashoffset:0; transition:stroke-dashoffset 1s ease }
.constel .lettre{ opacity:0 }
.constel.on .lettre{ animation:fondu .5s ease forwards }
.constel .st{ transition:fill .8s ease }
.capsule{ width:min(64vw, 280px); height:auto; cursor:pointer }
.capsule .couv{ transition:transform 1s ease; transform-origin:16px 30px }
.capsule.ouverte .couv{ transform:rotate(-24deg) translateY(-6px) }
.capsule .msg{ transition:transform 1s ease; transform:translateY(10px) }
.capsule.ouverte .msg{ transform:translateY(-14px) }
.capsule .sceau-c{ transition:opacity .6s ease }
.capsule.ouverte .sceau-c{ opacity:0 }
.capbtn{ border:0; background:none; padding:0; cursor:pointer; border-radius:16px }

}

  .milieu{ gap:22px } .bas .big{ margin-left:0; flex:1 }
}

}

<script id="module-sons">
/* =====================================================================
   Protocole V - sons.js
   Auteur : Milo (son). Module autonome, Web Audio API, aucun fichier audio,
   aucune ressource externe. Expose window.SonsV.

   Joueur tres sensible au bruit. Seuils fixes, verifies par SonsV.verifier() :
     - fondamentale (ou centre de filtre) entre 80 Hz et 2000 Hz
     - attaque >= 5 ms (pas de clic sec), extinction exponentielle
     - crete par voix <= 0,5 avant le gain maitre
     - gain maitre 0,15 par defaut, plafonne a 0,30
     - durees max : pop 0,12 s · carte 0,15 s · etape 0,40 s · paire 0,35 s
                    sceau 0,65 s · victoire 1,40 s
     - chaine : voix -> passe-bas 3 kHz -> limiteur (seuil -6 dB, garde-fou
       seulement) -> gain maitre -> sortie. Crete d'un son seul : 0,45 x 0,15
       = 0,068 de la pleine echelle, soit environ -23 dBFS.
     - rien en boucle, rien en fond ; un meme son ne se relance pas a moins de 60 ms
   Tonalite unique : do majeur.
   ===================================================================== */
(function () {
  'use strict';

  var CLE_MUET = 'protocoleV.sons.muet';
  var CLE_VOL = 'protocoleV.sons.volume';
  var VOL_DEFAUT = 0.15, VOL_MAX = 0.30;
  var F_MIN = 80, F_MAX = 2000, ATTAQUE_MIN = 0.005, CRETE_MAX = 0.5;
  var ANTI_REBOND = 0.06, VOIX_MAX = 12;

  var DUREE_MAX = { pop: 0.12, carte: 0.15, etape: 0.40, paire: 0.35, sceau: 0.65, victoire: 1.40 };

  /* ---- Partitions. t = depart (s), a = attaque (s), d = duree totale de la voix (s),
          g = crete, f0 -> f1 = glissando (Hz), fc0 -> fc1 = balayage du filtre (Hz). ---- */
  var SONS = {
    // petite bulle qui monte : sinus 420 -> 680 Hz, 90 ms
    pop: [
      { type: 'osc', onde: 'sine', f0: 420, f1: 680, t: 0, a: 0.006, d: 0.09, g: 0.45 }
    ],
    // froissement de carte : souffle filtre + petit appui grave, 110 ms
    carte: [
      { type: 'bruit', filtre: 'bandpass', fc0: 700, fc1: 1400, q: 1.2, t: 0, a: 0.012, d: 0.11, g: 0.30 },
      { type: 'osc', onde: 'triangle', f0: 300, f1: 260, t: 0, a: 0.006, d: 0.07, g: 0.12 }
    ],
    // souffle tres leger, decale de 50 ms pour ne pas s'empiler sur le pop du bouton
    etape: [
      { type: 'bruit', filtre: 'lowpass', fc0: 300, fc1: 1100, q: 0.7, t: 0.05, a: 0.12, d: 0.32, g: 0.22 }
    ],
    // paire trouvee : do5 puis sol5 (quinte montante), 320 ms
    paire: [
      { type: 'osc', onde: 'sine',     f0: 523.25, t: 0,    a: 0.008, d: 0.18, g: 0.34 },
      { type: 'osc', onde: 'triangle', f0: 523.25, t: 0,    a: 0.008, d: 0.18, g: 0.07 },
      { type: 'osc', onde: 'sine',     f0: 783.99, t: 0.10, a: 0.008, d: 0.22, g: 0.40 },
      { type: 'osc', onde: 'triangle', f0: 783.99, t: 0.10, a: 0.008, d: 0.22, g: 0.08 }
    ],
    // sceau : carillon doux mi5 - sol5 - do6, 600 ms
    sceau: [
      { type: 'osc', onde: 'sine',     f0: 659.25,  t: 0,    a: 0.006, d: 0.38, g: 0.30 },
      { type: 'osc', onde: 'triangle', f0: 659.25,  t: 0,    a: 0.006, d: 0.20, g: 0.05 },
      { type: 'osc', onde: 'sine',     f0: 783.99,  t: 0.11, a: 0.006, d: 0.38, g: 0.28 },
      { type: 'osc', onde: 'triangle', f0: 783.99,  t: 0.11, a: 0.006, d: 0.20, g: 0.05 },
      { type: 'osc', onde: 'sine',     f0: 1046.50, t: 0.22, a: 0.006, d: 0.38, g: 0.34 },
      { type: 'osc', onde: 'triangle', f0: 1046.50, t: 0.22, a: 0.006, d: 0.20, g: 0.05 }
    ],
    // victoire : arpege do5 mi5 sol5, puis accord do6 / sol4 / do4 tenu, 1,20 s
    victoire: [
      { type: 'osc', onde: 'sine',     f0: 523.25,  t: 0,    a: 0.008, d: 0.25, g: 0.28 },
      { type: 'osc', onde: 'sine',     f0: 659.25,  t: 0.13, a: 0.008, d: 0.25, g: 0.31 },
      { type: 'osc', onde: 'sine',     f0: 783.99,  t: 0.26, a: 0.008, d: 0.30, g: 0.34 },
      { type: 'osc', onde: 'sine',     f0: 1046.50, t: 0.40, a: 0.020, d: 0.80, g: 0.36 },
      { type: 'osc', onde: 'sine',     f0: 392.00,  t: 0.40, a: 0.030, d: 0.80, g: 0.12 },
      { type: 'osc', onde: 'triangle', f0: 261.63,  t: 0.40, a: 0.030, d: 0.80, g: 0.14 }
    ]
  };

  /* ---- Etat ---- */
  var ctx = null, bus = null, maitre = null, bruitBuf = null;
  var actives = 0, dernier = {};
  var muetEtat = lire(CLE_MUET) === '1';
  var volume = borne(parseFloat(lire(CLE_VOL)), VOL_DEFAUT);

  function lire(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function borne(v, defaut) { if (typeof v !== 'number' || isNaN(v)) return defaut; return Math.max(0, Math.min(VOL_MAX, v)); }

  /* ---- Demarrage au premier toucher seulement ---- */
  function deverrouiller() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        var passeBas = ctx.createBiquadFilter();
        passeBas.type = 'lowpass'; passeBas.frequency.value = 3000; passeBas.Q.value = 0.5;
        var limiteur = ctx.createDynamicsCompressor();
        limiteur.threshold.value = -6; limiteur.knee.value = 6; limiteur.ratio.value = 12;
        limiteur.attack.value = 0.003; limiteur.release.value = 0.1;
        maitre = ctx.createGain();
        maitre.gain.value = muetEtat ? 0 : volume;
        passeBas.connect(limiteur); limiteur.connect(maitre); maitre.connect(ctx.destination);
        bus = passeBas;
        bruitBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
        var dat = bruitBuf.getChannelData(0);
        for (var i = 0; i < dat.length; i++) dat[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* pas d'audio : le jeu reste muet, sans erreur */ }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, deverrouiller, { capture: true, passive: true });
  });

  /* ---- Moteur ---- */
  function enveloppe(g, t0, v) {
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v.g, t0 + v.a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + v.d);
    g.gain.setValueAtTime(0, t0 + v.d + 0.005);
  }

  function voix(v, t0) {
    var g = ctx.createGain(), src;
    if (v.type === 'osc') {
      src = ctx.createOscillator();
      src.type = v.onde;
      src.frequency.setValueAtTime(v.f0, t0);
      if (v.f1) src.frequency.exponentialRampToValueAtTime(v.f1, t0 + Math.min(0.05, v.d));
      src.connect(g);
    } else {
      src = ctx.createBufferSource();
      src.buffer = bruitBuf;
      var f = ctx.createBiquadFilter();
      f.type = v.filtre; f.Q.value = v.q;
      f.frequency.setValueAtTime(v.fc0, t0);
      f.frequency.exponentialRampToValueAtTime(v.fc1, t0 + v.d * 0.6);
      src.connect(f); f.connect(g);
    }
    enveloppe(g, t0, v);
    g.connect(bus);
    actives++;
    src.onended = function () { actives--; try { g.disconnect(); } catch (e) {} };
    src.start(t0);
    src.stop(t0 + v.d + 0.02);
  }

  function jouer(nom) {
    if (muetEtat || !ctx || ctx.state !== 'running') return;
    var now = ctx.currentTime;
    if (dernier[nom] !== undefined && now - dernier[nom] < ANTI_REBOND) return;
    var p = SONS[nom];
    if (actives + p.length > VOIX_MAX) return;
    dernier[nom] = now;
    var base = now + 0.01;
    try { p.forEach(function (v) { voix(v, base + v.t); }); } catch (e) { /* silence plutot qu'erreur */ }
  }

  /* ---- Controle par code, sans oreille ---- */
  function verifier() {
    var ecarts = [];
    Object.keys(SONS).forEach(function (nom) {
      SONS[nom].forEach(function (v, i) {
        var id = nom + '[' + i + ']';
        var fs = v.type === 'osc' ? [v.f0, v.f1 || v.f0] : [v.fc0, v.fc1];
        fs.forEach(function (f) { if (f < F_MIN || f > F_MAX) ecarts.push(id + ' frequence ' + f + ' Hz hors [80, 2000]'); });
        if (v.a < ATTAQUE_MIN) ecarts.push(id + ' attaque ' + v.a + ' s < 5 ms');
        if (v.a >= v.d) ecarts.push(id + ' attaque >= duree');
        if (v.g > CRETE_MAX) ecarts.push(id + ' crete ' + v.g + ' > 0,5');
        if (v.t + v.d > DUREE_MAX[nom]) ecarts.push(id + ' finit a ' + (v.t + v.d).toFixed(2) + ' s > ' + DUREE_MAX[nom] + ' s');
      });
    });
    if (VOL_DEFAUT > VOL_MAX) ecarts.push('volume par defaut > plafond');
    return ecarts; // tableau vide = tous les seuils tenus
  }

  window.SonsV = {
    pop: function () { jouer('pop'); },
    carte: function () { jouer('carte'); },
    sceau: function () { jouer('sceau'); },
    paire: function () { jouer('paire'); },
    etape: function () { jouer('etape'); },
    victoire: function () { jouer('victoire'); },
    setVolume: function (v) {
      volume = borne(Number(v), VOL_DEFAUT);
      ecrire(CLE_VOL, String(volume));
      if (maitre && !muetEtat) maitre.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
      return volume;
    },
    muet: function (oui) {
      muetEtat = !!oui;
      ecrire(CLE_MUET, muetEtat ? '1' : '0');
      if (maitre) maitre.gain.setTargetAtTime(muetEtat ? 0 : volume, ctx.currentTime, 0.02);
      return muetEtat;
    },
    estMuet: function () { return muetEtat; },
    verifier: verifier
  };
})();

</script>

function obsHTML(){
  const fini = S.ok.length === 4;
  return `<p class="hud" id="obsEtat">${fini ? 'Signal confirmé' : 'Touche une carte Verset.'}</p>
    <p class="rang-lab glace">Verset</p>
    <div class="rang rv">${S.oV.map(i => { const ok = S.ok.includes(i), v = V[OBS[i].v];
      return carteHTML('V', `${ico('c-rouleau')}<span class="k">Verset</span>`, `${ico('c-rouleau')}<p class="vr">${esc(v.ref)}</p><span class="conf">Signal confirmé</span>`, ok, ok, `data-v="${i}"`) }).join('')}</div>
    <p class="rang-lab or">Qui il est</p>
    <div class="rang">${S.oA.map(i => { const ok = S.ok.includes(i), c = OBS[i];
      return carteHTML('A', `${ico('dos-A')}<span class="k">Qui il est</span>`, `${ico(c.pic)}<p class="t">${esc(c.q)}</p><span class="conf">Signal confirmé</span>`, ok, ok, `data-a="${i}"`) }).join('')}</div>`;

let selV = null, occupe = false;
function brancherObs(){
  selV = null; occupe = false;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    const i = +b.dataset.v; if (occupe || S.ok.includes(i)) return;
    if (selV !== null && selV !== i) document.querySelector(`[data-v="${selV}"]`).classList.remove('ouverte');
    selV = i; b.classList.add('ouverte'); son('carte');
    setTimeout(() => ouvrirVerset(OBS[i].v), calme()?0:500);
  });
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const i = +b.dataset.a; if (occupe || selV === null || S.ok.includes(i)) return;
    occupe = true; b.classList.add('ouverte'); son('carte');
    const v = selV;
    if (i === v){
      setTimeout(()=>{ S.ok.push(i); save();
        const cv = document.querySelector(`[data-v="${i}"]`); cv.classList.add('ok'); b.classList.add('ok'); son('paire');
        celebrer(cv, 8, true); celebrer(b, 8, true); selV = null; occupe = false;
        $('obsEtat').textContent = S.ok.length === 4 ? 'Signal confirmé' : 'Signal confirmé · touche une autre carte Verset.';
        if (S.ok.length === 4) pret() }, 900);
    } else {
      setTimeout(()=>{ b.classList.remove('ouverte'); document.querySelector(`[data-v="${v}"]`).classList.remove('ouverte'); selV = null; occupe = false;
        $('obsEtat').textContent = 'Touche une carte Verset.' }, 1800);
    }
  });
}
function ouvrirVerset(k){
  const d = document.createElement('div'); d.className = 'voile'; d.id = 'voile';
  d.innerHTML = `<div class="boite-v">${versetHTML(k)}<button class="big" id="luOk">J'ai lu${ico('i-fleche')}</button>${pres(presVerset(k))}</div>`;
  document.body.appendChild(d); brancherVerset(k);
  $('luOk').onclick = () => { d.remove(); $('obsEtat').textContent = 'Trouve la carte Qui il est qui va avec.' };
}

/* ----- décodeur : le tri TITRE / NOM ----- */
let triOccupe = false;
function majTri(){
  const z = $('tri'); if (!z) return;
  const fini = S.tri.i >= 6, m = fini ? null : MOTS[S.tri.ordre[S.tri.i]];
  z.innerHTML = `<div class="pile">${fini ? `<div class="lire"><p class="frag">${esc(TRI_FIN)}</p></div>` :
      `<div class="mot" id="mot">${ico(m.nom ? 'i-etoile-or' : 'i-badge')}<div><p class="w">${esc(m.w)}</p><p class="r">${esc(m.r)}</p></div></div>`}</div>
    <div class="tiroirs">
      <button class="tiroir" data-t="titre"><span class="t-nom">TITRE</span><span class="t-contenu">${S.tri.titre.map(w=>`<span class="puce">${esc(w)}</span>`).join('')}</span></button>
      <button class="tiroir nom" data-t="nom"><span class="t-nom">NOM</span><span class="t-contenu">${S.tri.nom ? `<span class="puce or">${esc(S.tri.nom)}</span>` : ''}</span></button>
    </div>`;
  if (fini){ $('triEtat').textContent = 'Signal confirmé'; return }
  const c = $('mot'); let x0 = 0, y0 = 0, tenu = false;
  c.onpointerdown = ev => { if (triOccupe) return; tenu = true; x0 = ev.clientX; y0 = ev.clientY; c.dataset.dx = 0; c.dataset.dy = 0; c.setPointerCapture(ev.pointerId); c.classList.add('tenu'); c.style.transition = 'none' };
  c.onpointermove = ev => { if (!tenu) return; const dx = ev.clientX - x0, dy = ev.clientY - y0; c.dataset.dx = dx; c.dataset.dy = dy; c.style.transform = `translate(${dx}px,${dy}px)` };
  c.onpointerup = ev => { if (!tenu) return; tenu = false; c.classList.remove('tenu');
    const t = [...document.querySelectorAll('.tiroir')].find(b => { const r = b.getBoundingClientRect(); return ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom });
    if (t) deposer(t.dataset.t); else { c.style.transition = 'transform .5s cubic-bezier(.3,1.5,.5,1)'; c.style.transform = '' } };
  c.onpointercancel = () => { tenu = false; c.classList.remove('tenu'); c.style.transform = '' };
  document.querySelectorAll('.tiroir').forEach(b => b.onclick = () => deposer(b.dataset.t));
}
function deposer(t){
  const c = $('mot'); if (!c || triOccupe) return;
  const m = MOTS[S.tri.ordre[S.tri.i]], bon = (t === 'nom') === !!m.nom;
  const tir = document.querySelector(`.tiroir[data-t="${t}"]`), cr = tir.getBoundingClientRect(), r = c.getBoundingClientRect();
  const dx = +c.dataset.dx || 0, dy = +c.dataset.dy || 0;
  const tx = cr.left + cr.width/2 - (r.left + r.width/2) + dx, ty = cr.top + cr.height/2 - (r.top + r.height/2) + dy;
  triOccupe = true;
  if (bon){
    c.style.transition = 'transform .6s ease, opacity .6s ease'; c.style.transform = `translate(${tx}px,${ty}px) scale(.35)`; c.style.opacity = '0';
    setTimeout(()=>{ if (t === 'nom') S.tri.nom = m.w; else S.tri.titre.push(m.w); S.tri.i++; save(); son(t === 'nom' ? 'paire' : 'carte');
      triOccupe = false; majTri(); celebrer(document.querySelector(`.tiroir[data-t="${t}"]`), t === 'nom' ? 16 : 6, t !== 'nom');
      if (S.tri.i >= 6) pret() }, calme()?0:600);
  } else {
    /* mauvais tiroir : la carte rebondit doucement vers sa place, sans marque d'erreur */
    c.style.transition = 'transform .35s ease'; c.style.transform = `translate(${tx*.45}px,${ty*.45}px)`;
    setTimeout(()=>{ c.style.transition = 'transform .6s cubic-bezier(.3,1.5,.5,1)'; c.style.transform = ''; c.dataset.dx = 0; c.dataset.dy = 0;
      setTimeout(()=>{ triOccupe = false }, calme()?0:600) }, calme()?0:350);
  }
}
