<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Bérée</title>
<!--
  Mission Bérée, lff leçon 02 — version famille, à rejouer à la maison (usage personnel, hors Git).
  Copie de mission-beree-tablette.html sans aucune note de préparation : le jeu, les versets et les questions seulement.
  Aucun son. Aucune ressource externe. L'état est gardé dans le navigateur, sous une clé distincte de la version
  tablette ; « Recommencer » l'efface.
-->
<style>
:root{
  color-scheme: light;
  --bg:#FFF7E8; --paper:#FFFFFF; --ink:#1F2A33; --muted:#4F5B66; --line:#D9DDE1;
  --sky:#CDE8FF; --sky-d:#2F6FB5; --sage:#BDEBB2; --sage-d:#3C7D37;
  --gold:#FFC93C; --gold-l:#FFE9A6; --sand:#FFE3BC; --sand-d:#C98A3B;
  --lilac:#E7E3F4; --rose:#EDB8AE; --rust:#A65A45; --grey:#C9D1D8;
  --pres:#FFFFFF; --pres-b:#C9D6C5;
}
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color:transparent; }
body{ min-height:100dvh; padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px) }
button{ font:inherit; color:inherit }
[hidden]{ display:none !important }

/* barre du haut */
.top{ display:flex; align-items:center; gap:12px; height:64px; padding-top:env(safe-area-inset-top, 0px) }
.top .mini{ width:48px; height:48px; flex:none; opacity:0; transition:opacity 1s ease }
.top .mini.on{ opacity:1 }
.top .nom{ font-size:18px; font-weight:700; flex:1; min-width:0 }
.top .reset{ min-height:48px; padding:0 14px; border:1px solid var(--line); background:var(--paper); border-radius:12px;
  font-size:15px; font-weight:600; color:var(--muted) }
.confirm{ position:fixed; left:0; right:0; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:18px; font-weight:600 }
.confirm span{ flex:1 1 220px }

/* écrans */
.screen{ animation:fondu .7s ease both }
@keyframes fondu{ from{opacity:0} to{opacity:1} }

/* boutons pour l'enfant */
.big{ display:inline-flex; align-items:center; justify-content:center; gap:14px; min-height:76px; min-width:76px;
  padding:0 28px; border-radius:22px; border:2px solid #1F5A2A; background:linear-gradient(180deg,#B8F0A8,#6FCF6A); font-size:26px; font-weight:700;
  cursor:pointer; transition:transform .4s ease, background .6s ease; box-shadow:0 5px 0 #2E7A3A, 0 8px 16px rgba(46,122,58,.25) }
.big:active{ transform:translateY(3px); box-shadow:0 2px 0 #2E7A3A }
.big svg{ width:40px; height:40px; flex:none }
.big.gold{ background:linear-gradient(180deg,#FFF0A8,#FFC93C); border-color:#8A5A00; box-shadow:0 5px 0 #B57A00, 0 8px 16px rgba(181,122,0,.3) }
.big.sky{ background:var(--sky) }
.big[disabled]{ opacity:.45 }
.btn{ min-height:60px; padding:0 20px; border-radius:16px; border:2px solid var(--ink); background:var(--paper);
  font-size:19px; font-weight:700; cursor:pointer }
.btn.soft{ border-color:var(--line); color:var(--muted); font-weight:600 }
.row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center }

/* panneau à lire ensemble */
.pres{ background:var(--pres); border:1px solid var(--pres-b); border-left:6px solid var(--sage-d); border-radius:16px;
  padding:16px 18px; min-width:0 }
.pres + .pres{ margin-top:14px }
.tag{ font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--sage-d); text-transform:uppercase; margin:0 0 8px }
.dire{ font-size:19px; line-height:1.4; margin:0 0 10px; font-weight:500 }
.q{ font-size:23px; line-height:1.3; font-weight:700; margin:4px 0 14px }
.lead{ font-size:17px; color:var(--muted); margin:0 0 6px; font-weight:600 }
.vref{ font-size:27px; font-weight:700; margin:0 0 6px }
.vtext{ font-size:24px; line-height:1.42; margin:8px 0 6px; font-weight:500 }
.tog{ min-height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg);
  font-size:15px; font-weight:600; color:var(--muted); cursor:pointer }
hr.sep{ border:0; border-top:1px solid var(--line); margin:14px 0 }

/* tour du détective */
.tour textarea{ width:100%; min-height:84px; border-radius:12px; border:1px solid #AEB7BF; padding:12px; font:inherit;
  font-size:19px; background:var(--paper); resize:vertical }
.tour ul{ margin:10px 0 0; padding-left:20px; font-size:17px; line-height:1.4 }

/* plateau */
.plateau{ display:grid; gap:14px; height:max(560px, calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px));
  grid-template-rows:minmax(360px,1fr) auto }
.plateau .board{ min-height:0; display:flex; justify-content:center }
.plateau .board svg{ width:100%; height:100%; max-width:640px }
.plateau .side{ display:flex; flex-direction:column; gap:12px; align-items:stretch }
.plateau .side .big{ width:100% }
.etat{ font-size:16px; color:var(--muted); font-weight:600; text-align:center }
.secret-mini{ display:flex; align-items:center; gap:10px; font-size:15px; color:var(--muted); font-weight:600; justify-content:center }
.secret-mini svg{ width:44px; height:44px }
@media (orientation:landscape) and (min-width:700px){
  .plateau{ grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr) 300px; align-items:stretch }
  .plateau .board{ height:100% }
  .plateau .side{ justify-content:center }
}
.case-c{ transition:stroke-width .8s ease, stroke .8s ease }
.case-c.ici{ stroke:#C99A2E; stroke-width:3 }

/* accueil et secret */
.centre{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:12px 0 24px; text-align:center }
.badge-zone{ position:relative; display:grid; place-items:center }
.badge-btn{ border:0; background:none; padding:0; cursor:pointer; width:min(56vw, 300px, 40dvh); aspect-ratio:70/88; border-radius:24px }
.badge-btn svg{ width:100%; height:100%; display:block; transition:transform 1.6s ease, filter 1.6s ease;
  filter:drop-shadow(0 6px 10px rgba(120,80,0,.25)) }
.badge-btn.recu svg{ transform:scale(1.07); filter:drop-shadow(0 0 22px rgba(255,201,60,.95)) drop-shadow(0 6px 10px rgba(120,80,0,.25)) }
.eclats{ position:absolute; inset:-8%; pointer-events:none }
.eclats svg{ position:absolute; width:12%; height:auto; opacity:0; transform:scale(.4); transition:opacity 1.6s ease, transform 1.6s ease }
.recu-zone .eclats svg{ opacity:1; transform:scale(1) }
.eclats svg:nth-child(2){ transition-delay:.25s } .eclats svg:nth-child(3){ transition-delay:.5s }
.eclats svg:nth-child(4){ transition-delay:.75s } .eclats svg:nth-child(5){ transition-delay:1s } .eclats svg:nth-child(6){ transition-delay:1.25s }
.flotte{ animation:flotte 7s ease-in-out infinite alternate }
@keyframes flotte{ from{ transform:translateY(0) } to{ transform:translateY(-10px) } }
.touche{ display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; color:var(--muted) }
.touche svg{ width:44px; height:44px }
.titre-enfant{ font-size:clamp(28px, 4.4vw, 40px); font-weight:700; margin:0 }
.wrap{ max-width:760px; margin:0 auto; width:100% }
.env{ width:min(70vw, 340px); aspect-ratio:64/46 }
.env .rabat{ transform-origin:50% 14.5%; transition:transform 1.4s ease }
.env.ouvert .rabat{ transform:scaleY(-1) }
.env .papier{ transition:transform 1.4s ease, opacity 1.4s ease }
.env.ouvert .papier{ transform:translateY(-12px) }
.env .sceau{ opacity:0; transition:opacity 1.2s ease 1s }
.env.ferme .sceau{ opacity:1 }
.champ{ width:100%; min-height:64px; border-radius:14px; border:1px solid #AEB7BF; padding:12px 14px; font:inherit; font-size:22px; background:var(--paper) }

/* écran d'une case */
.case{ display:grid; gap:16px; padding-bottom:28px }
.case .enfant{ display:flex; flex-direction:column; align-items:center; gap:10px }
.case .disque{ width:min(56vw, 260px); aspect-ratio:1; border-radius:50%; border:3px solid var(--ink); display:grid; place-items:center; position:relative;
  background-image:radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 60%) !important;
  box-shadow:0 8px 20px rgba(0,0,0,.12), inset 0 -8px 16px rgba(0,0,0,.06) }
.case .disque svg{ width:66%; height:66% }
.case .disque .n{ position:absolute; left:2%; top:2%; width:64px; height:64px; border-radius:50%; background:var(--paper);
  border:3px solid var(--ink); display:grid; place-items:center; font-size:34px; font-weight:700 }
.case .fin{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px }
@media (orientation:landscape) and (min-width:700px){
  .case{ grid-template-columns:minmax(0,38fr) minmax(0,62fr); align-items:start }
  .case .enfant{ position:sticky; top:8px }
}

/* coffre et cartes */
.coffre{ display:grid; gap:16px; padding-bottom:28px }
.cartes{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px }
.carte{ border:0; background:none; padding:0; perspective:900px; aspect-ratio:63/88; cursor:pointer; min-width:0 }
.carte .in{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform 1.2s ease }
.carte.ouverte .in{ transform:rotateY(180deg) }
.carte .f{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:12px;
  border:2px solid var(--sky-d); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; overflow:hidden }
.carte .dos{ background:radial-gradient(circle at 50% 38%, #4F86E8 0%, #2C55B0 60%, #1E3C86 100%); border-color:#16306E;
  box-shadow:inset 0 0 0 3px #FFC93C, inset 0 0 0 5px #16306E }
.carte .dos svg{ width:66%; height:auto }
.carte .dos .r{ font-size:13px; font-weight:700; text-align:center; padding:0 4px; line-height:1.15; color:#FFFFFF }
.carte .face{ transform:rotateY(180deg); background:linear-gradient(180deg,#FFFFFF,#EAF4FF); box-shadow:0 0 16px rgba(255,201,60,.75) }
.carte.tlm .face{ border-color:var(--sage-d); background:linear-gradient(180deg,#FFFFFF,#EAF9E4) }
.carte .face svg{ width:82%; height:auto }
.carte.choisie .face{ box-shadow:0 0 0 5px #FFB300, 0 0 26px rgba(255,179,0,.9) }
.carte[disabled]{ cursor:default }
.carte.eteinte:not(.ouverte){ opacity:.55 }
.focus{ display:grid; gap:14px; align-items:start }
.grande{ background:linear-gradient(180deg,#FFFFFF,#EAF4FF); border:3px solid var(--sky-d); border-radius:20px; padding:16px; text-align:center;
  animation:fondu .9s ease both; box-shadow:0 0 0 4px #FFE9A6, 0 10px 24px rgba(47,111,181,.18) }
.grande.tlm{ background:linear-gradient(180deg,#FFFFFF,#EAF9E4) }
.grande.tlm{ border-color:var(--sage-d) }
.grande .cat{ font-size:18px; font-weight:700; letter-spacing:.06em; background:var(--sky); border-radius:10px; padding:6px }
.grande.tlm .cat{ background:var(--sage) }
.grande svg{ width:min(46vw, 210px); height:auto; margin:10px auto 4px; display:block }
.grande .ph{ font-size:26px; font-weight:700; line-height:1.25; margin:0 }
@media (orientation:landscape) and (min-width:700px){
  /* paysage : les cartes à gauche, restent en vue ; la carte ouverte et le panneau à droite */
  .coffre{ grid-template-columns:minmax(0,52fr) minmax(0,48fr); grid-template-areas:"intro intro" "cartes focus" "cartes suite"; align-items:start }
  .coffre > .pres:first-child{ grid-area:intro }
  .coffre .cartes{ grid-area:cartes; position:sticky; top:8px }
  .coffre .focus{ grid-area:focus }
  .coffre #suiteCoffre{ grid-area:suite }
  .grande svg{ width:min(22vw, 190px) }
}
@media (max-width:520px){
  .cartes{ grid-template-columns:repeat(4, minmax(0,1fr)) }
  .carte .dos .r{ font-size:11px }
}
.secret-ouvert{ font-size:30px; font-weight:700; background:linear-gradient(180deg,#FFF6C8,#FFD95C); border:2px solid #8A5A00; border-radius:16px;
  box-shadow:0 0 22px rgba(255,201,60,.8);
  padding:16px 18px; text-align:center; animation:fondu 1.2s ease both }

/* arrivée */
.arrivee{ display:grid; gap:16px; padding-bottom:28px }
.scene{ width:min(80vw, 420px); margin:0 auto; display:block }
.scene .soleil{ animation:lever 3.2s ease-out both }
.scene .rayons{ transform-origin:150px 34px; animation:tourne 80s linear infinite }
.scene .arc{ animation:fondu 4s ease 1.2s both }
@keyframes lever{ from{ transform:translateY(34px); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes tourne{ to{ transform:rotate(360deg) } }
.favs{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center }
.favs .carte{ width:min(26vw, 150px) }
.m3{ font-size:24px; line-height:1.35; font-weight:700 }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01s !important; transition-duration:.01s !important }
}
</style>
</head>

<script>
/* ============ TEXTES — versets et références recopiés tels quels ============ */

  ac:  { ref:"Actes 17:11", txt:"« Les Juifs de Bérée avaient des sentiments plus nobles que ceux de Thessalonique, car ils accueillirent la parole avec le plus grand empressement, examinant soigneusement les Écritures chaque jour pour vérifier que ce qu'on leur disait était exact. »" },

const CARTES = [
  { id:'p1', fam:'pers', pic:'p-larme',   ph:"ne souffrira, ne vieillira, ni ne mourra", ref:"Isaïe 25:8",

const CASES = {
  1:{ pic:'i-soleil', fond:'#FFE68A' }, 2:{ pic:'i-loupe', fond:'#BFE3FF' }, 3:{ pic:'i-coffre', fond:'#FFD9A0' },
  4:{ pic:'i-ecran', fond:'#DCD2FF' }, 5:{ pic:'i-maison', fond:'#C5EEB8' }

const LIRE = 'À lire ensemble', QUESTION = 'La question';

/* ============ ÉTAT (gardé dans le navigateur, clé propre à la version famille) ============ */
const CLE = 'mission-beree-famille-v1';
const neuf = () => ({ ecran:'accueil', badge:false, secret:'', scelle:false, pos:0, faites:[], ordre:melange(CARTES.map(c=>c.id)),
  ouvertes:[], focus:null, secretOuvert:false, toutes:false, verdict:null, fav:null, m3:false, boite:[] });
function melange(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }
let S;
try{ S = JSON.parse(localStorage.getItem(CLE)) || neuf() }catch(e){ S = neuf() }
function save(){ try{ localStorage.setItem(CLE, JSON.stringify(S)) }catch(e){} }

const app = document.getElementById('app');
const carte = id => CARTES.find(c=>c.id===id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const use = (id, extra='') => `<use href="#${id}" width="64" height="64" ${extra}/>`;
const verset = (ref, txt, lead) => `<div class="vbloc">${lead?`<p class="lead">${lead}</p>`:''}<p class="vref">${esc(ref)}</p>
  <button class="tog" data-tog>Masquer le texte</button><p class="vtext">${esc(txt)}</p></div>`;
const question = q => `<p class="q">« ${esc(q)} »</p>`;
const picCarte = c => c.fam==='pers' ? use(c.pic)+use('ban') : use('halo')+use(c.pic);

function aller(ecran){ S.ecran = ecran; save(); render(); window.scrollTo(0,0) }

/* ============ RENDU ============ */
function render(){
  document.getElementById('miniBadge').classList.toggle('on', S.badge);
  const e = S.ecran;
  if (e==='accueil') return rAccueil();
  if (e==='secret') return rSecret();
  if (e==='plateau') return rPlateau();
  if (e.startsWith('case')){ const n=+e.slice(4); return n===3 ? rCoffre() : n===5 ? rArrivee() : rCase(n) }
}

function rAccueil(){
  app.innerHTML = `<section class="screen centre wrap">
    <div class="badge-zone ${S.badge?'recu-zone':''}" id="bzone">
      <button class="badge-btn ${S.badge?'recu':''}" id="badge" aria-label="Recevoir le badge"><svg viewBox="0 0 70 88"><use href="#sym-badge"/></svg></button>
      <div class="eclats" aria-hidden="true">
        ${[[2,10],[84,6],[-2,52],[88,48],[10,86],[80,84]].map(([x,y])=>`<svg viewBox="0 0 64 64" style="left:${x}%;top:${y}%">${use('i-eclat')}</svg>`).join('')}
      </div>
    </div>
    <div class="touche" id="hint" ${S.badge?'hidden':''}><svg viewBox="0 0 64 64">${use('i-main')}</svg>Touche le badge</div>
    <p class="titre-enfant" id="titreBadge" ${S.badge?'':'hidden'}>Détective de Bérée</p>
    <button class="big" id="suite" ${S.badge?'':'hidden'}><svg viewBox="0 0 64 64">${use('i-pas')}</svg>Suite</button>
    <div class="pres" style="text-align:left;width:100%">
      <p class="tag">${LIRE}</p>
      <p class="dire">« Aujourd'hui, tu es détective. Il y a 5 cases. Quand ton pion arrive au bout, on a fini. »</p>
    </div></section>`;
  document.getElementById('badge').onclick = () => {
    if (S.badge) return;
    S.badge = true; save();
    document.getElementById('badge').classList.add('recu');
    document.getElementById('bzone').classList.add('recu-zone');
    document.getElementById('hint').hidden = true;
    setTimeout(()=>{ document.getElementById('titreBadge').hidden=false; document.getElementById('suite').hidden=false;
      document.getElementById('miniBadge').classList.add('on') }, 1300);
  };
  document.getElementById('suite').onclick = () => aller('secret');
}

}
function rSecret(){
  app.innerHTML = `<section class="screen centre wrap">
    <p class="titre-enfant">LE SECRET</p>
    ${enveloppe(S.scelle?'ferme':'ouvert')}
    <div class="pres" style="text-align:left;width:100%">

      ${question("Tu peux effacer une chose du monde pour toujours. Laquelle ?")}
      <p class="dire">On l'écrit ici, et l'enveloppe se ferme. On l'ouvrira dans le coffre.</p>
      <div id="saisie" ${S.scelle?'hidden':''}>
        <input class="champ" id="champSecret" type="text" autocomplete="off" placeholder="La chose à faire disparaître" value="${esc(S.secret)}">

      </div>
      <p class="dire" id="scelleOk" ${S.scelle?'':'hidden'}>L'enveloppe est fermée. Elle s'ouvrira à la case 3.</p>

    <button class="big" id="versPlateau" ${S.scelle?'':'hidden'}><svg viewBox="0 0 64 64">${use('i-pas')}</svg>Le plateau</button>
  </section>`;
  document.getElementById('fermer').onclick = () => {
    const v = document.getElementById('champSecret').value.trim();
    if (!v){ document.getElementById('champSecret').focus(); return }
    S.secret = v; S.scelle = true; save();
    document.activeElement.blur();
    const env = document.getElementById('env'); env.classList.remove('ouvert'); env.classList.add('ferme');

    setTimeout(()=>{ document.getElementById('scelleOk').hidden=false; document.getElementById('versPlateau').hidden=false }, 1600);
  };

}

/* ----- plateau ----- */
const PTS = { 0:[125,251,0], 1:[45,230,24], 2:[145,192,24], 3:[45,152,24], 4:[145,112,24], 5:[95,54,32] };
const LEGS = { 1:"M125 251 C 95 251, 72 230, 45 230", 2:"M45 230 C 95 230, 95 192, 145 192", 3:"M145 192 C 95 192, 95 152, 45 152",
  4:"M45 152 C 95 152, 95 112, 145 112", 5:"M145 112 C 145 82, 95 92, 95 54" };
const DOCK = n => { const r = PTS[n][2]; return n===0 ? [0,0] : [r*.62, r*.62] };

    </div></section>`;
  const b = document.getElementById('suivante');

function avancer(){
  const de = S.pos, a = S.pos + 1, leg = document.getElementById('leg'+a), pion = document.getElementById('pion');
  const L = leg.getTotalLength(), [ox0,oy0] = DOCK(de), [ox1,oy1] = DOCK(a);
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches, D = reduit ? 1 : 2200;
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  const t0 = performance.now();
  document.querySelectorAll('.case-c').forEach(c=>c.classList.remove('ici'));
  function pas(now){
    const t = Math.min(1,(now-t0)/D), k = ease(t), p = leg.getPointAtLength(k*L);
    const ox = ox0 + (ox1-ox0)*k, oy = oy0 + (oy1-oy0)*k;
    pion.setAttribute('transform', `translate(${p.x+ox} ${p.y+oy})`);
    if (t<1) requestAnimationFrame(pas);
    else { S.pos = a; save(); document.querySelector(`.case-c[data-c="${a}"]`).classList.add('ici');
      setTimeout(()=>aller('case'+a), reduit ? 0 : 900) }
  }
  requestAnimationFrame(pas);
}

/* ----- tour du détective ----- */
function tour(n){
  const mes = S.boite.filter(x=>x.c===n);
  return `<div class="pres tour"><p class="tag">Tour du détective</p>
    <p class="dire">À toi de poser une question, n'importe laquelle. On y répond, ou on la range dans la boîte à enquêtes.</p>
    <textarea id="tq" placeholder="La question du détective"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="ranger">Ranger dans la boîte à enquêtes</button></div>
    <ul id="tl">${mes.map(x=>`<li>${esc(x.q)}</li>`).join('')}</ul></div>`;
}
function brancherTour(n){
  document.getElementById('ranger').onclick = () => {
    const t = document.getElementById('tq'), v = t.value.trim(); if (!v) return;
    S.boite.push({c:n, q:v}); save(); t.value='';
    document.getElementById('tl').insertAdjacentHTML('beforeend', `<li>${esc(v)}</li>`);
  };
}
function finCase(n, phrase){
  return `<div class="fin">${phrase?`<p class="dire" style="width:100%;margin:0">${phrase}</p>`:''}
    <button class="big" id="retour"><svg viewBox="0 0 64 64">${use('i-pas')}</svg>Au plateau</button></div>`;
}
function brancherFin(n){
  document.getElementById('retour').onclick = () => { if(!S.faites.includes(n)) S.faites.push(n); aller('plateau') };
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    const p = b.nextElementSibling; p.hidden = !p.hidden; b.textContent = p.hidden ? 'Afficher le texte' : 'Masquer le texte' });
}
function enfant(n){
  return `<div class="enfant"><div class="disque" style="background:${CASES[n].fond}">
    <svg viewBox="0 0 64 64">${use(CASES[n].pic)}</svg><div class="n">${n}</div></div></div>`;
}

/* ----- cases 1, 2, 4 ----- */
function rCase(n){
  let corps = '';
  if (n===1) corps = `

    ${question("Quelle bonne nouvelle la Bible nous donne pour plus tard ?")}
    <hr class="sep">
    ${verset(V.re.ref, V.re.txt)}
    ${question("D'après la Bible, comment sera la vie un jour ?")}`;
  if (n===2) corps = `
    <p class="dire">À Bérée, les gens écoutaient, puis vérifiaient chaque jour dans les Écritures. Ce sont les premiers détectives de la Bible. C'est pour ça que tu as ce badge.</p>
    ${verset(V.ac.ref, V.ac.txt)}
    ${question("Comment être sûr que ces promesses vont vraiment arriver ?")}`;
  if (n===4) corps = `
    <div class="row" style="gap:14px;align-items:center;margin-bottom:10px">

    ${question("Qu'est-ce qui n'était pas juste, et faisait mal à Rafika ?")}

    <hr class="sep">
    ${verset(V.rm.ref, V.rm.txt)}
    ${question("Cet espoir peut t'aider dès aujourd'hui ? Pourquoi ?")}`;

  app.innerHTML = `<section class="screen case">${enfant(n)}
    <div><div class="pres"><p class="tag">${LIRE} · case ${n}</p>${corps}</div>${tour(n)}${finCase(n, phrase)}</div></section>`;

/* ----- case 3 : le coffre ----- */
function carteHTML(c, ouverte, extra=''){
  return `<button class="carte ${c.fam} ${ouverte?'ouverte':''}" data-id="${c.id}" ${extra} aria-label="Carte-promesse">
    <div class="in"><div class="f dos"><svg viewBox="0 0 64 64">${use('i-coffre')}</svg><div class="r">${esc(c.ref)}</div></div>
    <div class="f face"><svg viewBox="0 0 64 64">${picCarte(c)}</svg></div></div></button>`;
}
function rCoffre(){
  app.innerHTML = `<section class="screen coffre">
    <div class="pres"><p class="tag">${LIRE} · case 3, le coffre</p>
      <p class="dire" style="margin:0">« Dans ce coffre, il y a des promesses de Jéhovah. Tu en retournes trois. »</p></div>
    <div class="cartes" id="cartes">${S.ordre.map(id=>carteHTML(carte(id), S.ouvertes.includes(id) || S.toutes)).join('')}</div>
    <div class="focus" id="focus"></div>
    <div id="suiteCoffre"></div>
  </section>`;
  majCartes(); majFocus(); majSuite();
  document.querySelectorAll('#cartes .carte').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (S.ouvertes.includes(id) || (S.toutes && !S.ouvertes.includes(id))){ S.focus = id; save(); majFocus(); return }
    if (S.ouvertes.length >= 3) return;
    S.ouvertes.push(id); S.focus = id; save();
    b.classList.add('ouverte'); majCartes();
    setTimeout(()=>{ majFocus(); majSuite() }, 900);
  });
}
function majCartes(){
  const plein = S.ouvertes.length >= 3 && !S.toutes;
  document.querySelectorAll('#cartes .carte').forEach(b => b.classList.toggle('eteinte', plein && !S.ouvertes.includes(b.dataset.id)));
}
function majFocus(){
  const f = document.getElementById('focus');
  if (!S.focus){ f.innerHTML = `<div class="touche" style="justify-content:center;grid-column:1/-1"><svg viewBox="0 0 64 64">${use('i-main')}</svg>Touche une carte</div>`; return }
  const c = carte(S.focus);
  f.innerHTML = `<div class="grande ${c.fam}"><div class="cat">${c.fam==='pers'?'PERSONNE…':'TOUT LE MONDE…'}</div>
      <svg viewBox="0 0 64 64">${picCarte(c)}</svg><p class="ph">${esc(c.ph)}</p></div>
    <div class="pres"><p class="tag">${LIRE} · la promesse, puis le verset</p>
      ${c.v.map(([r,t])=>verset(r,t)).join('')}
      <p class="lead">Une des deux questions :</p>
      ${question("Ce verset te promet quoi de bien ?")}${question("Qui, autour de toi, serait content d'entendre ça ?")}
    </div>`;
  f.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => { const p=b.nextElementSibling; p.hidden=!p.hidden; b.textContent=p.hidden?'Afficher le texte':'Masquer le texte' });
}
function majSuite(){
  const s = document.getElementById('suiteCoffre'), n = S.ouvertes.length;
  if (n < 2){ s.innerHTML=''; return }
  let h = '';
  if (n >= 3 || S.secretOuvert) h += `<div class="pres"><p class="tag">${QUESTION}</p>${question("Laquelle tu préfères ? Pourquoi ?")}</div>`;
  if (!S.secretOuvert){
    h += `<div class="row" style="margin-top:14px;justify-content:center">
      <button class="big gold" id="ouvrirSecret"><svg viewBox="0 0 64 64">${use('i-secret')}</svg>Ouvrir LE SECRET</button></div>`;
  } else {
    h += `<div class="pres" style="margin-top:14px"><p class="tag">LE SECRET</p>
      <div class="secret-ouvert">${esc(S.secret || '(rien d\'écrit)')}</div>
      ${question("Ta chose est sur la liste de Jéhovah ?")}
      ${!S.toutes ? `<button class="btn" id="toutes">Retourner les autres cartes</button>` : `
        <div class="row">
          <button class="btn" id="yEst" ${S.verdict==='oui'?'style="background:#DCEDD6"':''}>Elle y est</button>
          <button class="btn" id="pasLa" ${S.verdict==='boite'?'style="background:#DCEDD6"':''}>Elle va dans la boîte à enquêtes</button>
        </div>`}
    </div>`;
    if (S.toutes && S.verdict){
      h += `${tour(3)}${finCase(3, "Encore deux cases, puis l'arrivée.")}`;
    }
  }
  s.innerHTML = h;
  const o = document.getElementById('ouvrirSecret');
  if (o) o.onclick = () => { S.secretOuvert = true; save(); majSuite() };
  const t = document.getElementById('toutes');
  if (t) t.onclick = () => {
    S.toutes = true; save();
    const restes = [...document.querySelectorAll('#cartes .carte:not(.ouverte)')];
    restes.forEach((b,i)=>setTimeout(()=>b.classList.add('ouverte'), i*450));
    majCartes();
    setTimeout(majSuite, restes.length*450 + 900);
  };
  const y = document.getElementById('yEst'), p = document.getElementById('pasLa');
  if (y) y.onclick = () => { if (S.verdict==='boite') S.boite = S.boite.filter(x=>!(x.c===3 && x.secret)); S.verdict='oui'; save(); majSuite() };
  if (p) p.onclick = () => { if (S.verdict!=='boite'){ S.boite.push({c:3, q:'Le secret : '+S.secret, secret:true}) } S.verdict='boite'; save(); majSuite() };
  if (document.getElementById('ranger')){ brancherTour(3); brancherFin(3) }
}
