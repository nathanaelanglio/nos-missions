<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocole V</title>
<!--
  Protocole V, leçon 03 — version famille, à rejouer à la maison.
  Copie de protocole-v-tablette.html sans aucune note de préparation : le jeu, les versets, les questions et les relances.
  Aucune vibration, aucun clignotement, aucun compte à rebours. Mouvement lent et doux ; tout s'arrête si l'appareil demande
  « moins de mouvement ». Son : module de Milo (sons.js), inclus tel quel. Aucune ressource externe.
  L'état est gardé dans le navigateur, sous une clé propre à cette version ; « Recommencer » l'efface.
-->
<style>
:root{
  color-scheme: dark;
  --bg:#1D2938; --bg2:#243345; --surf:#2B3B50; --line:#41556F; --txt:#EAF2F8; --txt2:#B9C8D6;
  --cyan:#5FD0E4; --cyan-d:#2E8FA3; --amber:#F2B84B; --amber-d:#B9821C; --green:#6FD6A2; --green-d:#2F9466;
  --gold:#FFD25E; --rose:#F2A3A0;
  --pres:#F5F8FB; --ink:#1B2633; --muted:#4C5A69; --pres-b:#C7D3DF;
  --hud:Bahnschrift, 'DIN Alternate', 'DIN Condensed', 'Arial Narrow', 'Segoe UI', system-ui, Roboto, sans-serif;
}
:root{ --titre:#FFFFFF; --cyan-t:#5FD0E4; --amber-t:#F2B84B; --gold-t:#FFD25E; --green-t:#6FD6A2;
  --route:#2E4A62; --off1:#2B3B50; --off2:#243345; --offl:#41556F; --lab-n:#EAF2F8; --lab-off:#8FA1B5; --node-off:#566578 }
/* thème clair par défaut : fond bleu-gris doux, jamais blanc pur ; les écrans du jeu restent sombres */
html[data-theme="clair"]{
  color-scheme: light;
  --bg:#E6EDF3; --bg2:#D8E2EC; --surf:#FFFFFF; --line:#A9BACB; --txt:#1B2633; --txt2:#44566A;
  --titre:#1B2633; --cyan-t:#14768A; --amber-t:#8A5A00; --gold-t:#8A5A00; --green-t:#1E7A50;
  --route:#C3D2E0; --off1:#D3DEE8; --off2:#E6EDF3; --offl:#9DB0C3; --lab-n:#1B2633; --lab-off:#6A7C8F; --node-off:#C2CDD8;
}
html[data-theme="clair"] .decor .grille{ background-image:linear-gradient(rgba(20,118,138,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(20,118,138,.08) 1px, transparent 1px) }
html[data-theme="clair"] .decor .flux{ background:linear-gradient(180deg, transparent, rgba(20,118,138,.16) 45%, rgba(20,118,138,.16) 55%, transparent) }
html[data-theme="clair"] .titre{ text-shadow:0 2px 0 rgba(95,208,228,.35) }
html[data-theme="clair"] .sceau.on .s-disque{ filter:drop-shadow(0 0 6px rgba(227,154,18,.6)) }
*{ box-sizing:border-box }
html,body{ margin:0; background:var(--bg); color:var(--txt);
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  -webkit-tap-highlight-color:transparent }
body{ min-height:100dvh; padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px) }
button{ font:inherit; color:inherit }
[hidden]{ display:none !important }
.hud{ font-family:var(--hud); letter-spacing:.08em; text-transform:uppercase }

/* barre du haut */
.top{ display:flex; align-items:center; gap:12px; height:64px; padding-top:env(safe-area-inset-top, 0px) }
.top .mini{ display:flex; align-items:center; gap:8px; opacity:0; transition:opacity 1s ease; min-width:0 }
.top .mini.on{ opacity:1 }
.top .mini svg{ width:52px; height:34px; flex:none }
.top .mini span{ font-family:var(--hud); font-size:14px; letter-spacing:.06em; color:var(--cyan-t); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.top .nom{ font-family:var(--hud); font-size:18px; letter-spacing:.1em; text-transform:uppercase; flex:1; min-width:0; text-align:right; padding-right:6px; color:var(--txt2) }
.top .reset{ min-height:48px; padding:0 14px; border:1px solid var(--line); background:var(--bg2); border-radius:12px;
  font-size:15px; font-weight:600; color:var(--txt2) }
@media (max-width:440px){ .top .nom{ display:none } .top .mini{ flex:1 } }
.slot-hp{ display:inline-flex; align-items:center; flex:none; gap:2px }
.hp{ width:48px; height:48px; border:0; background:transparent; color:var(--txt2); border-radius:12px; display:grid; place-items:center; cursor:pointer; padding:0 }
.hp svg{ width:30px; height:30px }
.confirm{ position:fixed; left:0; right:0; top:0; z-index:20; background:var(--pres); color:var(--ink); border-bottom:1px solid var(--pres-b);
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-wrap:wrap; gap:12px; align-items:center; font-size:18px; font-weight:600 }
.confirm span{ flex:1 1 220px }

.screen{ animation:entree .65s cubic-bezier(.2,.8,.2,1) both; position:relative; z-index:1 }
.screen.zoom{ animation-name:zoomin }
@keyframes entree{ from{ opacity:0; transform:translateY(18px) scale(.985) } to{ opacity:1; transform:none } }
@keyframes zoomin{ from{ opacity:0; transform:scale(.93) } to{ opacity:1; transform:none } }
@keyframes fondu{ from{opacity:0} to{opacity:1} }

/* décor de fond vivant : grille qui respire, lignes de données qui défilent (lent, faible contraste) */
.decor{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden }
.decor .grille{ position:absolute; inset:0; background-image:linear-gradient(rgba(95,208,228,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(95,208,228,.07) 1px, transparent 1px);
  background-size:32px 32px; animation:respire 9s ease-in-out infinite alternate }
.decor .flux{ position:absolute; top:-50%; bottom:-50%; width:2px; background:linear-gradient(180deg, transparent, rgba(95,208,228,.22) 45%, rgba(95,208,228,.22) 55%, transparent);
  animation:flux 26s linear infinite }
.decor .flux:nth-child(2){ left:12% } .decor .flux:nth-child(3){ left:37%; animation-duration:34s; animation-delay:-12s }
.decor .flux:nth-child(4){ left:63%; animation-duration:30s; animation-delay:-20s } .decor .flux:nth-child(5){ left:88%; animation-duration:38s; animation-delay:-6s }
@keyframes respire{ from{ opacity:.45 } to{ opacity:1 } }
@keyframes flux{ from{ transform:translateY(-30%) } to{ transform:translateY(30%) } }
.top, .confirm{ position:relative; z-index:2 }
.confirm{ position:fixed }

/* toucher : halo qui s'étend et rebond léger */
.halo-t{ position:absolute; border-radius:50%; pointer-events:none; width:16px; height:16px; margin:-8px 0 0 -8px;
  background:radial-gradient(circle, rgba(255,255,255,.55), rgba(95,208,228,.25) 60%, transparent 70%); animation:halo .7s ease-out forwards; z-index:3 }
@keyframes halo{ from{ transform:scale(1); opacity:1 } to{ transform:scale(9); opacity:0 } }
.rebond{ animation:rebond .45s cubic-bezier(.3,1.6,.5,1) }
@keyframes rebond{ 0%{ transform:scale(1) } 40%{ transform:scale(.95) } 100%{ transform:scale(1) } }

/* récompense : balayage lumineux et particules lentes */
.brille{ position:relative; overflow:hidden }
.brille::after{ content:""; position:absolute; top:-20%; bottom:-20%; left:-60%; width:45%; transform:skewX(-20deg);
  background:linear-gradient(90deg, transparent, rgba(255,246,200,.75), transparent); animation:balaye 1.1s ease-out forwards; pointer-events:none }
@keyframes balaye{ from{ left:-60% } to{ left:120% } }
.particule{ position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:4;
  background:radial-gradient(circle, #FFF6C8, #FFD25E 60%, rgba(255,210,94,0) 70%); animation:monte 2.2s ease-out forwards }
.particule.verte{ background:radial-gradient(circle, #E6FFF1, #6FD6A2 60%, rgba(111,214,162,0) 70%) }
@keyframes monte{ 0%{ opacity:0; transform:translate(0,0) scale(.6) } 15%{ opacity:1 } 100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1) } }

/* compteur qui se remplit */
.jauge{ width:100%; max-width:520px; margin:0 auto }
.jauge .lig{ display:flex; justify-content:space-between; font-family:var(--hud); letter-spacing:.08em; font-size:14px; color:var(--txt2); margin-bottom:6px }
.jauge .lig b{ color:var(--gold-t); font-weight:700 }
.jauge .barre{ height:12px; border-radius:6px; background:#243345; border:1px solid var(--line); overflow:hidden }
.jauge .rempli{ height:100%; width:0; border-radius:6px; background:linear-gradient(90deg, #2E8FA3, #5FD0E4 60%, #FFD25E); transition:width 1.4s cubic-bezier(.2,.8,.2,1) }

/* boutons de l'enfant */
.big{ display:inline-flex; align-items:center; justify-content:center; gap:14px; min-height:76px; min-width:76px; padding:0 28px;
  border-radius:18px; border:2px solid var(--cyan); background:linear-gradient(180deg,#2F6E82,#1F4E60); color:#FFFFFF;
  font-family:var(--hud); font-size:24px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
  box-shadow:0 0 0 4px rgba(95,208,228,.15), 0 6px 18px rgba(0,0,0,.35); transition:transform .3s ease }
.big:active{ transform:translateY(2px) }
.big svg{ width:38px; height:38px; flex:none }
.big.gold{ border-color:var(--gold); background:linear-gradient(180deg,#8A6A1E,#5E4612); box-shadow:0 0 0 4px rgba(255,210,94,.2), 0 6px 18px rgba(0,0,0,.35) }
.big.green{ border-color:var(--green); background:linear-gradient(180deg,#2C7A57,#1C5640); box-shadow:0 0 0 4px rgba(111,214,162,.2), 0 6px 18px rgba(0,0,0,.35) }
.big[disabled]{ opacity:.45 }
.btn{ min-height:60px; padding:0 20px; border-radius:14px; border:2px solid var(--ink); background:#FFFFFF; color:var(--ink);
  font-size:18px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px }
.btn svg{ width:24px; height:24px }
.btn.on{ background:#D6F3E3; border-color:var(--green-d) }
.row{ display:flex; flex-wrap:wrap; gap:12px; align-items:center }

/* panneau à lire ensemble : clair, sobre */
.pres{ background:var(--pres); color:var(--ink); border:1px solid var(--pres-b); border-left:6px solid var(--cyan-d); border-radius:14px; padding:16px 18px; min-width:0 }
.pres + .pres, .pres + .tour{ margin-top:14px }
.tag{ font-size:13px; font-weight:700; letter-spacing:.06em; color:#1F6E80; text-transform:uppercase; margin:0 0 8px }
.dire{ font-size:19px; line-height:1.4; margin:0 0 10px; font-weight:500 }
.q{ font-size:24px; line-height:1.3; font-weight:700; margin:6px 0 4px }
.relance{ font-size:16px; color:var(--muted); margin:0 0 14px; font-weight:600 }
.lead{ font-size:16px; color:var(--muted); margin:0 0 6px; font-weight:600 }
.vref{ font-size:26px; font-weight:700; margin:0 0 6px }
.vtext{ font-size:23px; line-height:1.42; margin:8px 0 6px; font-weight:500 }
.note{ font-size:15px; color:var(--muted); line-height:1.4; margin:4px 0 8px }
.tog{ min-height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--pres-b); background:#E9EFF5;
  font-size:15px; font-weight:600; color:var(--muted); cursor:pointer }
details.repli{ margin:8px 0 12px; border-radius:12px; background:#EEF3F8; border:1px dashed #C7D3DF }
details summary{ list-style:none; cursor:pointer; min-height:48px; display:flex; align-items:center; gap:8px; padding:0 12px;
  font-size:14px; font-weight:600; color:var(--muted) }
details summary::-webkit-details-marker{ display:none }
details p{ margin:0; padding:0 14px 12px; font-size:16px; line-height:1.45; color:var(--ink) }
hr.sep{ border:0; border-top:1px solid var(--pres-b); margin:16px 0 }
.video{ display:flex; gap:14px; align-items:center; background:#EEF3F8; border:1px solid var(--pres-b); border-radius:12px; padding:10px 14px; margin:8px 0 12px }
.video svg{ width:52px; height:52px; flex:none }
.video p{ margin:0; font-size:17px; font-weight:600; line-height:1.35; min-width:0 }
.champ, .tour textarea, .pres textarea{ width:100%; border-radius:12px; border:1px solid #9FB0C1; padding:12px 14px; font:inherit; font-size:20px; background:#FFFFFF; color:var(--ink) }
.champ{ min-height:62px }
.pres textarea{ min-height:84px; resize:vertical }
.tour ul, .boite{ margin:10px 0 0; padding-left:20px; font-size:18px; line-height:1.45 }

/* plateau : carte des niveaux */
.plateau{ display:grid; gap:12px; height:max(600px, calc(100dvh - 64px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 12px));
  grid-template-rows:auto minmax(330px,1fr) auto }
.sceaux{ display:flex; justify-content:center; gap:14px; flex-wrap:wrap }
.sceau{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:92px }
.sceau svg{ width:72px; height:72px; overflow:visible }
.sceau .lab{ font-family:var(--hud); font-size:13px; letter-spacing:.08em; color:var(--txt2) }
.sceau.on .lab{ color:var(--gold-t) }
.s-disque{ transition:fill 1s ease, stroke 1s ease, filter 1s ease }
.s-ico{ transition:opacity 1s ease }
.sceau:not(.on) .s-ico{ opacity:.35 }
.sceau.on .s-disque{ filter:drop-shadow(0 0 7px rgba(255,210,94,.85)) }
.points{ display:flex; gap:6px; height:10px }
.points i{ width:10px; height:10px; border-radius:50%; border:1.5px solid var(--line); display:block; transition:background 1s ease, border-color 1s ease }
.points i.on{ background:var(--gold); border-color:var(--gold) }
.plateau .board{ min-height:0; display:flex; justify-content:center }
.plateau .board svg{ width:100%; height:100%; max-width:640px }
.plateau .side{ display:flex; flex-direction:column; gap:12px; align-items:stretch }
.plateau .side .big{ width:100% }
.etat{ font-family:var(--hud); font-size:16px; letter-spacing:.08em; color:var(--txt2); text-align:center; margin:0 }
.verrou-mini{ display:flex; align-items:center; gap:10px; font-size:15px; color:var(--amber-t); font-weight:600; justify-content:center; margin:0 }
.verrou-mini svg{ width:36px; height:36px }
@media (orientation:landscape) and (min-width:700px){
  .plateau{ grid-template-rows:auto minmax(0,1fr); grid-template-columns:minmax(0,1fr) 300px; grid-template-areas:"sceaux side" "board side" }
  .plateau .sceaux{ grid-area:sceaux } .plateau .board{ grid-area:board; height:100% } .plateau .side{ grid-area:side; justify-content:center }
}
.noeud{ transition:stroke .8s ease, stroke-width .8s ease }
.noeud.ici{ stroke:var(--gold); stroke-width:3 }

/* accueil, carte d'accès, protocole */
.centre{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:12px 0 24px; text-align:center }
.wrap{ max-width:780px; margin:0 auto; width:100% }
.titre{ font-family:var(--hud); font-size:clamp(44px, 8vw, 72px); letter-spacing:.12em; margin:0; color:var(--titre);
  text-shadow:0 0 18px rgba(95,208,228,.45) }
.sous{ font-family:var(--hud); font-size:clamp(18px, 3vw, 24px); letter-spacing:.14em; text-transform:uppercase; color:var(--cyan-t); margin:-6px 0 0 }
.dossier{ width:min(78vw, 380px) }
.dossier svg{ width:100%; height:auto; display:block }
.touche{ display:flex; align-items:center; gap:10px; font-size:21px; font-weight:700; color:var(--txt2) }
.touche svg{ width:42px; height:42px }
.idcarte{ position:relative; width:min(90vw, 460px); aspect-ratio:85.6/54; border-radius:18px; text-align:left;
  background:linear-gradient(135deg,#2C4A66,#1F3348 60%,#22465A); border:2px solid var(--cyan); padding:5% 6%;
  box-shadow:0 0 0 5px rgba(95,208,228,.12), 0 12px 30px rgba(0,0,0,.4); overflow:hidden }
.fente{ width:min(96vw, 500px); height:14px; border-radius:7px; background:#141E2A; border:2px solid var(--line); margin-bottom:-22px; position:relative; z-index:2 }
.idcarte.imprime{ animation:imprime 1.6s cubic-bezier(.3,.7,.2,1) both }
@keyframes imprime{ from{ clip-path:inset(0 0 100% 0); transform:translateY(-30px) } to{ clip-path:inset(0 0 0 0); transform:none } }
.idcarte .scanl{ position:absolute; left:0; right:0; top:0; height:3px; background:var(--cyan); box-shadow:0 0 14px 4px rgba(95,208,228,.55); opacity:0; pointer-events:none }
.idcarte.scanne .scanl{ animation:scanv 1.2s ease-in-out forwards }
@keyframes scanv{ 0%{ top:0; opacity:1 } 90%{ opacity:1 } 100%{ top:100%; opacity:0 } }
.idcarte .entete{ font-family:var(--hud); letter-spacing:.12em; font-size:clamp(14px,2.4vw,18px); color:var(--cyan); text-transform:uppercase }
.idcarte .corps{ display:flex; gap:5%; margin-top:5%; align-items:center }
.idcarte .avatar{ width:26%; aspect-ratio:1; flex:none }
.idcarte .lig{ font-size:clamp(13px,2vw,16px); color:var(--txt2); margin:0 0 4px }
.idcarte .val{ font-family:var(--hud); font-size:clamp(20px,3.6vw,30px); letter-spacing:.06em; color:#FFFFFF; margin:0; word-break:break-word }
.tampon{ position:absolute; right:5%; bottom:8%; padding:6px 14px; border:3px solid var(--green); border-radius:10px; color:var(--green);
  font-family:var(--hud); letter-spacing:.12em; text-transform:uppercase; font-size:clamp(16px,3vw,24px); transform:rotate(-8deg) scale(1.6); opacity:0;
  transition:transform .9s ease, opacity .9s ease; background:rgba(29,41,56,.55) }
.tampon.on{ transform:rotate(-8deg) scale(1); opacity:1 }
.cadenas{ width:min(46vw, 210px) }
.cadenas .anse{ transition:transform 1s ease; transform-origin:44px 40px }
.cadenas.ouvert .anse{ transform:translateY(-10px) }
.cadenas .corps-c{ transition:fill 1s ease }
.cadenas.ferme .corps-c{ fill:var(--amber) }

/* écran d'un niveau */
.niveau{ display:grid; gap:16px; padding-bottom:28px }
.niveau .enfant{ display:flex; flex-direction:column; align-items:center; gap:12px }
.ecran-hud{ width:min(60vw, 280px); aspect-ratio:1; border-radius:24px; border:2px solid var(--cyan); background:radial-gradient(circle at 50% 40%, #33506C, #1E2C3D 70%);
  display:grid; place-items:center; position:relative; box-shadow:0 0 0 5px rgba(95,208,228,.1) }
.ecran-hud > svg{ width:62% ; height:62% }
.ecran-hud .num{ position:absolute; left:10px; top:8px; font-family:var(--hud); font-size:18px; letter-spacing:.08em; color:var(--cyan) }
.nom-niv{ font-family:var(--hud); font-size:clamp(24px,4vw,34px); letter-spacing:.1em; margin:0; color:var(--titre); text-align:center }
.niveau .fin{ display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; align-items:center }
.niveau .fin .dire{ color:var(--txt); width:100%; margin:0 }
.allume{ display:flex; flex-direction:column; align-items:center; gap:10px; margin:16px 0 0; padding:14px; border-radius:16px; background:var(--bg2); border:1px solid var(--line) }
.allume .sceau svg{ width:110px; height:110px }
.allume .sceau .lab{ font-size:16px }
@media (orientation:landscape) and (min-width:700px){
  .niveau{ grid-template-columns:minmax(0,36fr) minmax(0,64fr); align-items:start }
  .niveau .enfant{ position:sticky; top:8px }
  .ecran-hud{ width:min(28vw, 260px) }
}

/* niveau 1 : scan des noms */
.tags{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 12px }
.tagnom{ position:relative; overflow:hidden; min-height:60px; padding:0 18px; border-radius:12px; border:2px solid var(--cyan-d); background:#E8F7FA; color:var(--ink);
  font-size:20px; font-weight:700; cursor:pointer }
.tagnom::after{ content:""; position:absolute; top:0; bottom:0; left:-30%; width:30%; background:linear-gradient(90deg,transparent,rgba(95,208,228,.75),transparent); opacity:0 }
.tagnom.scan::after{ animation:scan .9s ease forwards }
@keyframes scan{ 0%{ left:-30%; opacity:1 } 100%{ left:100%; opacity:1 } }
.tagnom.vu{ background:#D6F3E3; border-color:var(--green-d) }

/* cartes */
.carte{ border:0; background:none; padding:0; perspective:900px; cursor:pointer; min-width:0; aspect-ratio:63/92; width:100% }
.carte .in{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s ease }
.carte.ouverte .in{ transform:rotateY(180deg) }
.carte .f{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px; padding:8px 8px 10px }
.carte .dos{ justify-content:center }
.carte.A .dos{ background:radial-gradient(circle at 50% 40%, #FFD27A, #E3A23A 70%, #B9821C); border:3px solid #FFE3A6 }
.carte.V .dos{ background:radial-gradient(circle at 50% 40%, #8FE8F5, #3FB7CC 70%, #2E8FA3); border:3px solid #CFF6FC }
.carte .dos svg{ width:68%; height:auto }
.carte .dos .k{ font-family:var(--hud); letter-spacing:.1em; font-size:15px; color:#1B2633 }
.carte .face{ transform:rotateY(180deg); background:#F7FAFC; color:var(--ink) }
.carte.A .face{ border:3px solid var(--amber) }
.carte.V .face{ border:3px solid var(--cyan) }
.carte .face .k{ font-family:var(--hud); letter-spacing:.1em; font-size:13px; color:var(--muted) }
.carte .face svg{ width:42%; height:auto; flex:none }
.rang .carte{ aspect-ratio:63/100 }
@media (orientation:landscape) and (min-width:700px){ .rang .carte{ aspect-ratio:63/112 } }
.carte .face .t{ font-size:15px; font-weight:700; line-height:1.25; text-align:center; margin:0 }
.carte .face .r{ font-size:13px; font-weight:600; color:var(--muted); margin:0 }
.carte.ok .face{ border-color:var(--green); background:#E6F8EE; box-shadow:0 0 18px rgba(111,214,162,.75) }
.carte .conf{ font-family:var(--hud); font-size:12px; letter-spacing:.06em; color:var(--green-d); opacity:0; transition:opacity .9s ease; margin-top:auto; text-align:center }
.carte.ok .conf{ opacity:1 }
.carte.choisie .face{ box-shadow:0 0 0 4px var(--gold), 0 0 22px rgba(255,210,94,.8) }
.pilate{ width:min(52vw, 230px); margin:6px auto 4px }
.pilate .carte{ cursor:default }
.paires{ display:grid; gap:10px }
.rang{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px }
.rang-lab{ font-family:var(--hud); letter-spacing:.1em; font-size:15px; margin:4px 0 0 }
.rang-lab.A{ color:var(--amber-t) } .rang-lab.V{ color:var(--cyan-t) }
.confirme{ text-align:center; font-family:var(--hud); letter-spacing:.1em; color:var(--green-t); font-size:20px; min-height:28px; margin:4px 0 }
@media (max-width:560px){ .carte .face .t{ font-size:12.5px } .carte .face svg{ width:42% } }

/* niveau 2 : schéma de la pluie */
.pluie{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:8px 0 12px }
.etape{ min-height:120px; border-radius:14px; border:2px solid var(--pres-b); background:#EEF3F8; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px; color:var(--ink) }
.etape svg{ width:62px; height:62px; opacity:.4; transition:opacity .9s ease, transform .9s ease }
.etape span{ font-size:15px; font-weight:700 }
.etape.on{ border-color:var(--cyan-d); background:#E1F6FA }
.etape.on svg{ opacity:1; transform:translateY(-3px) }

/* niveau 4 : radar */
.radar .balai{ transform-origin:50% 50%; transform:rotate(0deg) }
.radar.go .balai{ animation:balai 1s ease-out forwards }
@keyframes balai{ from{ transform:rotate(-360deg) } to{ transform:rotate(0deg) } }

/* niveau 5 : verdict */
.verdict-zone{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:8px 0 }
.grand-tampon{ width:min(80vw, 380px); opacity:0; transform:scale(1.25); transition:opacity 1s ease, transform 1s ease }
.grand-tampon.on{ opacity:1; transform:none }
.enbref{ font-size:24px; line-height:1.35; font-weight:700; text-align:center; margin:0 }
.env{ width:min(60vw, 260px); aspect-ratio:64/46 }
.env .rabat{ transform-origin:50% 14.5%; transition:transform 1s ease }
.env.ouvert .rabat{ transform:scaleY(-1) }
.env .papier{ transition:transform 1s ease }
.env.ouvert .papier{ transform:translateY(-12px) }
.env .sceau-e{ opacity:0; transition:opacity .8s ease .2s }
.env.ferme .sceau-e{ opacity:1 }
.m4{ font-size:24px; line-height:1.35; font-weight:700; margin:6px 0 }
.envbtn{ border:0; background:none; padding:0; cursor:pointer; border-radius:14px }

/* lecture par l'enfant (dyslexie légère) : sans empattement, grand, interligne 1,5, un peu d'espace entre les lettres,
   aligné à gauche, jamais justifié, sans italique, contraste doux (encre #1B2633 sur fond #F5F8FB, jamais noir sur blanc pur) */
.pres{ text-align:left; font-style:normal }
.pres p, .pres li, .pres textarea, .pres input{ letter-spacing:.02em; word-spacing:.08em; text-align:left; hyphens:none }
.dire{ font-size:20px; line-height:1.5; max-width:62ch }
.q{ font-size:24px; line-height:1.45 }
.lead{ font-size:18px; line-height:1.5; color:#36485A }
.vref{ font-size:24px; line-height:1.4 }
.vtext{ font-size:22px; line-height:1.6; font-weight:500; max-width:60ch }
.note{ font-size:17px; line-height:1.5; color:#36485A }
.carte .face .t{ line-height:1.35; letter-spacing:.01em }
.indice-btn{ min-height:48px; padding:0 16px; border-radius:12px; border:1px dashed #2E8FA3; background:#E8F7FA; color:#14586A;
  font-size:16px; font-weight:700; cursor:pointer; margin:2px 0 14px }
.indice{ font-size:18px; line-height:1.5; color:#14586A; font-weight:600; background:#E8F7FA; border-radius:10px; padding:8px 12px; margin:2px 0 14px;
  animation:fondu .6s ease both }
.idcarte .val{ letter-spacing:.06em }
/* téléphone : les cartes de Babylone passent sur deux colonnes, sinon leur texte ne tient pas */
@media (max-width:560px){ .rang{ grid-template-columns:repeat(2, minmax(0,1fr)) } .rang .carte{ aspect-ratio:63/96 } .carte .face .t{ font-size:14px } }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01s !important; animation-iteration-count:1 !important; transition-duration:.01s !important }
  .decor .flux, .particule, .halo-t{ display:none }
}

<script id="module-sons">
/* =====================================================================
   Protocole V - sons.js
   Auteur : Milo (son). Module autonome, Web Audio API, aucun fichier audio,
   aucune ressource externe. Expose window.SonsV.

   Joueur tres sensible au bruit. Seuils fixes, verifies par SonsV.verifier() :
     - fondamentale (ou centre de filtre) entre 80 Hz et 2000 Hz
     - attaque >= 5 ms (pas de clic sec), extinction exponentielle
     - crete par voix <= 0,5 avant le gain maitre
     - gain maitre 0,15 par defaut, plafonne a 0,30
     - durees max : pop 0,12 s · carte 0,15 s · etape 0,40 s · paire 0,35 s
                    sceau 0,65 s · victoire 1,40 s
     - chaine : voix -> passe-bas 3 kHz -> limiteur (seuil -6 dB, garde-fou
       seulement) -> gain maitre -> sortie. Crete d'un son seul : 0,45 x 0,15
       = 0,068 de la pleine echelle, soit environ -23 dBFS.
     - rien en boucle, rien en fond ; un meme son ne se relance pas a moins de 60 ms
   Tonalite unique : do majeur.
   ===================================================================== */
(function () {
  'use strict';

  var CLE_MUET = 'protocoleV.sons.muet';
  var CLE_VOL = 'protocoleV.sons.volume';
  var VOL_DEFAUT = 0.15, VOL_MAX = 0.30;
  var F_MIN = 80, F_MAX = 2000, ATTAQUE_MIN = 0.005, CRETE_MAX = 0.5;
  var ANTI_REBOND = 0.06, VOIX_MAX = 12;

  var DUREE_MAX = { pop: 0.12, carte: 0.15, etape: 0.40, paire: 0.35, sceau: 0.65, victoire: 1.40 };

  /* ---- Partitions. t = depart (s), a = attaque (s), d = duree totale de la voix (s),
          g = crete, f0 -> f1 = glissando (Hz), fc0 -> fc1 = balayage du filtre (Hz). ---- */
  var SONS = {
    // petite bulle qui monte : sinus 420 -> 680 Hz, 90 ms
    pop: [
      { type: 'osc', onde: 'sine', f0: 420, f1: 680, t: 0, a: 0.006, d: 0.09, g: 0.45 }
    ],
    // froissement de carte : souffle filtre + petit appui grave, 110 ms
    carte: [
      { type: 'bruit', filtre: 'bandpass', fc0: 700, fc1: 1400, q: 1.2, t: 0, a: 0.012, d: 0.11, g: 0.30 },
      { type: 'osc', onde: 'triangle', f0: 300, f1: 260, t: 0, a: 0.006, d: 0.07, g: 0.12 }
    ],
    // souffle tres leger, decale de 50 ms pour ne pas s'empiler sur le pop du bouton
    etape: [
      { type: 'bruit', filtre: 'lowpass', fc0: 300, fc1: 1100, q: 0.7, t: 0.05, a: 0.12, d: 0.32, g: 0.22 }
    ],
    // paire trouvee : do5 puis sol5 (quinte montante), 320 ms
    paire: [
      { type: 'osc', onde: 'sine',     f0: 523.25, t: 0,    a: 0.008, d: 0.18, g: 0.34 },
      { type: 'osc', onde: 'triangle', f0: 523.25, t: 0,    a: 0.008, d: 0.18, g: 0.07 },
      { type: 'osc', onde: 'sine',     f0: 783.99, t: 0.10, a: 0.008, d: 0.22, g: 0.40 },
      { type: 'osc', onde: 'triangle', f0: 783.99, t: 0.10, a: 0.008, d: 0.22, g: 0.08 }
    ],
    // sceau : carillon doux mi5 - sol5 - do6, 600 ms
    sceau: [
      { type: 'osc', onde: 'sine',     f0: 659.25,  t: 0,    a: 0.006, d: 0.38, g: 0.30 },
      { type: 'osc', onde: 'triangle', f0: 659.25,  t: 0,    a: 0.006, d: 0.20, g: 0.05 },
      { type: 'osc', onde: 'sine',     f0: 783.99,  t: 0.11, a: 0.006, d: 0.38, g: 0.28 },
      { type: 'osc', onde: 'triangle', f0: 783.99,  t: 0.11, a: 0.006, d: 0.20, g: 0.05 },
      { type: 'osc', onde: 'sine',     f0: 1046.50, t: 0.22, a: 0.006, d: 0.38, g: 0.34 },
      { type: 'osc', onde: 'triangle', f0: 1046.50, t: 0.22, a: 0.006, d: 0.20, g: 0.05 }
    ],
    // victoire : arpege do5 mi5 sol5, puis accord do6 / sol4 / do4 tenu, 1,20 s
    victoire: [
      { type: 'osc', onde: 'sine',     f0: 523.25,  t: 0,    a: 0.008, d: 0.25, g: 0.28 },
      { type: 'osc', onde: 'sine',     f0: 659.25,  t: 0.13, a: 0.008, d: 0.25, g: 0.31 },
      { type: 'osc', onde: 'sine',     f0: 783.99,  t: 0.26, a: 0.008, d: 0.30, g: 0.34 },
      { type: 'osc', onde: 'sine',     f0: 1046.50, t: 0.40, a: 0.020, d: 0.80, g: 0.36 },
      { type: 'osc', onde: 'sine',     f0: 392.00,  t: 0.40, a: 0.030, d: 0.80, g: 0.12 },
      { type: 'osc', onde: 'triangle', f0: 261.63,  t: 0.40, a: 0.030, d: 0.80, g: 0.14 }
    ]
  };

  /* ---- Etat ---- */
  var ctx = null, bus = null, maitre = null, bruitBuf = null;
  var actives = 0, dernier = {};
  var muetEtat = lire(CLE_MUET) === '1';
  var volume = borne(parseFloat(lire(CLE_VOL)), VOL_DEFAUT);

  function lire(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function ecrire(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function borne(v, defaut) { if (typeof v !== 'number' || isNaN(v)) return defaut; return Math.max(0, Math.min(VOL_MAX, v)); }

  /* ---- Demarrage au premier toucher seulement ---- */
  function deverrouiller() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        var passeBas = ctx.createBiquadFilter();
        passeBas.type = 'lowpass'; passeBas.frequency.value = 3000; passeBas.Q.value = 0.5;
        var limiteur = ctx.createDynamicsCompressor();
        limiteur.threshold.value = -6; limiteur.knee.value = 6; limiteur.ratio.value = 12;
        limiteur.attack.value = 0.003; limiteur.release.value = 0.1;
        maitre = ctx.createGain();
        maitre.gain.value = muetEtat ? 0 : volume;
        passeBas.connect(limiteur); limiteur.connect(maitre); maitre.connect(ctx.destination);
        bus = passeBas;
        bruitBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.5), ctx.sampleRate);
        var dat = bruitBuf.getChannelData(0);
        for (var i = 0; i < dat.length; i++) dat[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { /* pas d'audio : le jeu reste muet, sans erreur */ }
  }
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, deverrouiller, { capture: true, passive: true });
  });

  /* ---- Moteur ---- */
  function enveloppe(g, t0, v) {
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v.g, t0 + v.a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + v.d);
    g.gain.setValueAtTime(0, t0 + v.d + 0.005);
  }

  function voix(v, t0) {
    var g = ctx.createGain(), src;
    if (v.type === 'osc') {
      src = ctx.createOscillator();
      src.type = v.onde;
      src.frequency.setValueAtTime(v.f0, t0);
      if (v.f1) src.frequency.exponentialRampToValueAtTime(v.f1, t0 + Math.min(0.05, v.d));
      src.connect(g);
    } else {
      src = ctx.createBufferSource();
      src.buffer = bruitBuf;
      var f = ctx.createBiquadFilter();
      f.type = v.filtre; f.Q.value = v.q;
      f.frequency.setValueAtTime(v.fc0, t0);
      f.frequency.exponentialRampToValueAtTime(v.fc1, t0 + v.d * 0.6);
      src.connect(f); f.connect(g);
    }
    enveloppe(g, t0, v);
    g.connect(bus);
    actives++;
    src.onended = function () { actives--; try { g.disconnect(); } catch (e) {} };
    src.start(t0);
    src.stop(t0 + v.d + 0.02);
  }

  function jouer(nom) {
    if (muetEtat || !ctx || ctx.state !== 'running') return;
    var now = ctx.currentTime;
    if (dernier[nom] !== undefined && now - dernier[nom] < ANTI_REBOND) return;
    var p = SONS[nom];
    if (actives + p.length > VOIX_MAX) return;
    dernier[nom] = now;
    var base = now + 0.01;
    try { p.forEach(function (v) { voix(v, base + v.t); }); } catch (e) { /* silence plutot qu'erreur */ }
  }

  /* ---- Controle par code, sans oreille ---- */
  function verifier() {
    var ecarts = [];
    Object.keys(SONS).forEach(function (nom) {
      SONS[nom].forEach(function (v, i) {
        var id = nom + '[' + i + ']';
        var fs = v.type === 'osc' ? [v.f0, v.f1 || v.f0] : [v.fc0, v.fc1];
        fs.forEach(function (f) { if (f < F_MIN || f > F_MAX) ecarts.push(id + ' frequence ' + f + ' Hz hors [80, 2000]'); });
        if (v.a < ATTAQUE_MIN) ecarts.push(id + ' attaque ' + v.a + ' s < 5 ms');
        if (v.a >= v.d) ecarts.push(id + ' attaque >= duree');
        if (v.g > CRETE_MAX) ecarts.push(id + ' crete ' + v.g + ' > 0,5');
        if (v.t + v.d > DUREE_MAX[nom]) ecarts.push(id + ' finit a ' + (v.t + v.d).toFixed(2) + ' s > ' + DUREE_MAX[nom] + ' s');
      });
    });
    if (VOL_DEFAUT > VOL_MAX) ecarts.push('volume par defaut > plafond');
    return ecarts; // tableau vide = tous les seuils tenus
  }

  window.SonsV = {
    pop: function () { jouer('pop'); },
    carte: function () { jouer('carte'); },
    sceau: function () { jouer('sceau'); },
    paire: function () { jouer('paire'); },
    etape: function () { jouer('etape'); },
    victoire: function () { jouer('victoire'); },
    setVolume: function (v) {
      volume = borne(Number(v), VOL_DEFAUT);
      ecrire(CLE_VOL, String(volume));
      if (maitre && !muetEtat) maitre.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
      return volume;
    },
    muet: function (oui) {
      muetEtat = !!oui;
      ecrire(CLE_MUET, muetEtat ? '1' : '0');
      if (maitre) maitre.gain.setTargetAtTime(muetEtat ? 0 : volume, ctx.currentTime, 0.02);
      return muetEtat;
    },
    estMuet: function () { return muetEtat; },
    verifier: verifier
  };
})();
</script>

function celebrer(el, n=14, verte=false){

const PTS = { 0:[128,252,0], 1:[45,228,22], 2:[145,190,22], 3:[45,150,22], 4:[145,110,22], 5:[95,48,29] };
const LEGS = { 1:"M128 252 C 95 252, 72 228, 45 228", 2:"M45 228 C 95 228, 95 190, 145 190", 3:"M145 190 C 95 190, 95 150, 45 150",
  4:"M45 150 C 95 150, 95 110, 145 110", 5:"M145 110 C 145 80, 95 86, 95 48" };

function rPlateau(){

      ${Object.entries(LEGS).map(([n,d])=>`<path id="leg${n}" d="${d}" fill="none" stroke="none"/>`).join('')}

  const avant = S.jauge || 0, apres = S.faites.length * 20;

  const vus = S.sceauxVus || {H:false,S:false,P:0};

}
function avancer(){
  const de = S.pos, a = S.pos+1, leg = $('leg'+a), pion = $('pion'), L = leg.getTotalLength();
  const [ox0,oy0] = DOCK(de), [ox1,oy1] = DOCK(a);
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches, D = reduit ? 1 : 1000;
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2, t0 = performance.now();
  document.querySelectorAll('.noeud').forEach(c=>c.classList.remove('ici'));
  function pas(now){
    const t = Math.min(1,(now-t0)/D), k = ease(t), p = leg.getPointAtLength(k*L);
    pion.setAttribute('transform', `translate(${p.x+ox0+(ox1-ox0)*k} ${p.y+oy0+(oy1-oy0)*k})`);
    if (t<1) requestAnimationFrame(pas);
    else { S.pos = a; save(); document.querySelector(`.noeud[data-n="${a}"]`).classList.add('ici'); setTimeout(()=>aller('niv'+a), reduit?0:600) }
  }
  requestAnimationFrame(pas);
}

  });
  brancherAllumage('S'); brancherTour(2); brancherFin(2);
}

/* ----- niveau 3 : CODE BABYLONE ----- */
function rN3(){
  page(3, `<div class="pres"><p class="tag">Niveau 3 · Code Babylone</p>
      <p class="tag">La question</p>${question(Q.q3)}
      ${verset(V.is46, "Lis Isaïe 46:10.")}
      <p class="note">« Une prophétie, c'est un message de Dieu, par exemple l'annonce de ce qui va arriver. »</p>
      <hr class="sep">${verset(V.is44, "Lis Isaïe 44:27 – 45:2.")}
      <p class="dire">Retourne une carte ANNONCÉ, puis cherche sa carte VÉRIFIÉ.</p>
    </div>
    <div style="margin-top:14px">
      <p class="rang-lab A">Annoncé · la Bible, 200 ans avant</p>
      <div class="rang" id="rangA">${S.oA.map(i=>carteA(i)).join('')}</div>
      <p class="confirme" id="confirme">${S.ok.length ? 'Correspondance confirmée' : ''}</p>
      <p class="rang-lab V">Vérifié · l'Histoire</p>
      <div class="rang" id="rangV">${S.oV.map(i=>carteV(i)).join('')}</div>
    </div>
    <div id="suite3"></div>`);
  brancherPaires(); majSuite3();
}
function carteA(i){ const c = PAIRES[i].A, ok = S.ok.includes(i);
  return carteFace('A', `${ico('dos-A')}<span class="k">Annoncé</span>`, `<span class="k">Annoncé</span>${ico(c.pic)}<p class="t">${esc(c.t)}</p><p class="r">${esc(c.r)}</p><span class="conf">Correspondance confirmée</span>`, ok, ok, `data-a="${i}"`) }
function carteV(i){ const c = PAIRES[i].V, ok = S.ok.includes(i);
  return carteFace('V', `${ico('dos-V')}<span class="k">Vérifié</span>`, `<span class="k">Vérifié</span>${ico(c.pic)}<p class="t">${esc(c.t)}</p><span class="conf">Correspondance confirmée</span>`, ok, ok, `data-v="${i}"`) }
let selA = null, occupe = false;
function brancherPaires(){
  selA = null; occupe = false;
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const i = +b.dataset.a; if (occupe || S.ok.includes(i)) return;
    if (selA !== null && selA !== i) document.querySelector(`[data-a="${selA}"]`).classList.remove('ouverte');
    const neuve = selA !== i;
    selA = i; b.classList.add('ouverte'); if (neuve) son('carte');
  });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    const i = +b.dataset.v; if (occupe || selA === null || S.ok.includes(i)) return;
    occupe = true; b.classList.add('ouverte'); son('carte');
    const a = selA;
    if (i === a){
      setTimeout(()=>{ S.ok.push(i); save();
        const ca = document.querySelector(`[data-a="${i}"]`); ca.classList.add('ok'); b.classList.add('ok'); son('paire');
        celebrer(ca, 8, true); celebrer(b, 8, true);
        $('confirme').textContent = 'Correspondance confirmée'; selA = null; occupe = false; majSuite3() }, 900);
    } else {
      setTimeout(()=>{ b.classList.remove('ouverte'); document.querySelector(`[data-a="${a}"]`).classList.remove('ouverte'); selA = null; occupe = false }, 1800);
    }
  });
}
function majSuite3(){
  const n = S.ok.length, s = $('suite3'); let h = '';
  if (n >= 3) h += `<div class="pres" style="margin-top:14px"><p class="tag">Trois paires trouvées</p>${question(Q.q5a)}
    ${video("La Bible avait annoncé la chute de Babylone", "0:58 en français, 0:45 en créole")}</div>`;
  if (n >= 4){
    h += `<div class="pres" style="margin-top:14px"><p class="tag">Quatrième paire</p>${verset(V.is13, "Lis Isaïe 13:19, 20.")}${question(Q.q5b)}</div>`;
    if (!S.secretOuvert) h += `<div class="row" style="justify-content:center;margin-top:16px"><button class="big gold" id="ouvrirSecret">${ico('i-cadenas-mini')}Ouvrir le protocole secret</button></div>`;
    else {
      h += `<div class="pres" style="margin-top:14px"><p class="tag">Ton protocole secret</p>
        <p class="q" style="font-weight:600">${esc(S.secret || '(rien d\'écrit)')}</p>
        <p class="dire">Relis tes idées. Est-ce que tu t'en es servi ?</p>
        <div class="row"><button class="btn ${S.verdictSecret==='oui'?'on':''}" id="servi">Je m'en suis servi ${ico('i-coche')}</button>
        <button class="btn ${S.verdictSecret==='boite'?'on':''}" id="aBoite">Dans ma boîte à enquêtes</button></div></div>`;
      if (S.verdictSecret){
        h += `<div class="pres" style="margin-top:14px">${allumage('P', 'Allumer le sceau Prophéties')}</div>
          ${tour(3)}${fin(3, "Encore deux niveaux.")}`;
      }
    }
  }
  s.innerHTML = h; brancherTog(s);
  const o = $('ouvrirSecret'); if (o) o.onclick = () => { S.secretOuvert = true; save(); majSuite3() };
  const y = $('servi'), p = $('aBoite');
  if (y) y.onclick = () => { S.boite = S.boite.filter(x=>!x.secret); S.verdictSecret='oui'; save(); majSuite3() };
  if (p) p.onclick = () => { if (S.verdictSecret!=='boite') S.boite.push({c:3, q:'Protocole : '+S.secret, secret:true}); S.verdictSecret='boite'; save(); majSuite3() };
  if ($('allumer')) brancherAllumage('P', () => S.sc.P >= 1);
  if ($('ranger')){ brancherTour(3); brancherFin(3) }
}

/* ----- niveau 4 : RADAR ----- */
function rN4(){
  const radar = `<svg class="radar" id="radar" viewBox="0 0 120 120" style="width:min(60vw,240px)" aria-hidden="true">
    <circle cx="60" cy="60" r="56" fill="#16303A" stroke="#6FD6A2" stroke-width="2"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#2F9466" stroke-width="1"/><circle cx="60" cy="60" r="20" fill="none" stroke="#2F9466" stroke-width="1"/>
    <path d="M60 4 V116 M4 60 H116" stroke="#2F9466" stroke-width=".8"/>
    <g class="balai"><path d="M60 60 L60 4 A56 56 0 0 1 108 32 Z" fill="#6FD6A2" opacity=".35"/><path d="M60 60 L108 32" stroke="#6FD6A2" stroke-width="2"/></g>
    <circle cx="84" cy="38" r="3.4" fill="#FFD25E"/><circle cx="40" cy="78" r="3" fill="#FFD25E"/><circle cx="74" cy="86" r="2.6" fill="#FFD25E"/>
    <circle cx="60" cy="60" r="3" fill="#6FD6A2"/></svg>`;
  page(4, `<div class="pres"><p class="tag">Niveau 4 · Radar</p>
      <p class="dire">« Le radar regarde notre époque. La Bible l'appelle "les derniers jours". »</p>
      ${verset(V.tm1, "Lis 2 Timothée 3:1.")}
      <hr class="sep">${verset(V.mt, "Lis Matthieu 24:6, 7.")}
      ${repli('Version créole (MTC)', esc(V.mtc[1]))}
      <p class="tag">La question</p>${question(Q.q6a)}
      <hr class="sep">${verset(V.tm5, "Lis 2 Timothée 3:1-5.")}
      ${question(Q.q6b)}${question(Q.q6c)}
      ${allumage('P', 'Le sceau Prophéties gagne un point', "« Celle-là, tu peux la vérifier toi-même, aujourd'hui. »")}
    </div>${tour(4)}${fin(4)}`, `<div style="margin-top:4px">${radar}</div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('radar').classList.add('go')));
  brancherAllumage('P', () => S.sc.P >= 2); brancherTour(4); brancherFin(4);
}

/* ----- niveau 5 : VERDICT ----- */
function enveloppe(cls){
  return `<svg class="env ${cls}" id="env" viewBox="0 0 64 46" aria-hidden="true">
    <rect class="papier" x="12" y="6" width="40" height="26" rx="2" fill="#FFFFFF" stroke="#1B2633" stroke-width="1.4"/>
    <rect x="3" y="7" width="58" height="36" rx="3" fill="#CFE0EE" stroke="#1B2633" stroke-width="2"/>
    <path d="M4 42 L32 24 L60 42" fill="none" stroke="#1B2633" stroke-width="1.6" stroke-linejoin="round"/>
    <path class="rabat" d="M3 8 L32 28 L61 8 Z" fill="#B5CADC" stroke="#1B2633" stroke-width="2" stroke-linejoin="round"/>
    <g class="sceau-e"><circle cx="32" cy="27" r="6.5" fill="url(#g-or)" stroke="#8A5A00" stroke-width="1.2"/>
    <text x="32" y="30" text-anchor="middle" font-family="Bahnschrift, 'Arial Narrow', sans-serif" font-size="8" font-weight="700" fill="#5E4612">4</text></g></svg>`;
}
function rN5(){
  if (!S.faites.includes(5)){ S.faites.push(5); save() }
  if (!victoireJouee){ victoireJouee = true; son('victoire') }
  const tampon = `<svg class="grand-tampon ${S.verdict?'on':''}" id="tampon" viewBox="0 0 300 300" aria-label="Dossier vérifié">
    <circle cx="150" cy="150" r="140" fill="none" stroke="#6FD6A2" stroke-width="6"/>
    <circle cx="150" cy="150" r="128" fill="rgba(111,214,162,.08)" stroke="#6FD6A2" stroke-width="2" stroke-dasharray="6 5"/>
    ${[['H',70,70],['S',150,48],['P',230,70]].map(([k,x,y])=>`<g transform="translate(${x-34} ${y-6})"><circle cx="34" cy="34" r="32" fill="url(#g-or)" stroke="#B57A00" stroke-width="3"/>
      <circle cx="34" cy="34" r="25" fill="#FFF6D6"/><use href="#se-${k}" x="12" y="12" width="44" height="44"/></g>`).join('')}
    <rect x="44" y="150" width="212" height="64" rx="10" fill="#1D2938" stroke="#6FD6A2" stroke-width="4" transform="rotate(-6 150 182)"/>
    <text x="150" y="176" text-anchor="middle" transform="rotate(-6 150 182)" font-family="Bahnschrift, 'Arial Narrow', 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#6FD6A2">DOSSIER</text>
    <text x="150" y="204" text-anchor="middle" transform="rotate(-6 150 182)" font-family="Bahnschrift, 'Arial Narrow', 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#6FD6A2">VÉRIFIÉ</text>
    <use href="#lv5" x="122" y="226" width="56" height="56"/></svg>`;
  app.innerHTML = `<section class="screen niveau">
    ${enfant(5, `<div class="verdict-zone"><div class="sceaux">${sceau('H')}${sceau('S')}${sceau('P')}</div>
      ${tampon}<button class="big gold" id="rendre" ${S.verdict?'hidden':''}>Rendre le verdict</button></div>`)}
    <div>
      <div class="pres"><p class="tag">On entend parfois</p>
        <p class="dire">« Certains disent : la Bible, c'est des légendes. »</p>
        <p class="tag">La question</p>${question(Q.oep)}
        <p class="dire">Tu peux répondre en montrant un de tes trois sceaux.</p></div>
      <div class="pres" id="enbrefBloc" ${S.verdict?'':'hidden'}><p class="tag">En bref</p>
        <p class="enbref">« L'Histoire, la science et les prophéties démontrent que vous pouvez avoir confiance en la Bible. »</p></div>
      <div class="pres"><p class="tag">Une question de révision, au choix</p>${question(Q.r1)}${question(Q.r2)}${question(Q.r3)}</div>
      <div class="pres"><p class="tag">Mission 4</p>
        <div class="centre" style="padding:4px 0">
          <button class="envbtn" id="m4" aria-label="Ouvrir Mission 4">${enveloppe(S.m4?'ouvert':'ferme')}</button>
          <div class="touche" id="m4hint" style="color:#4C5A69" ${S.m4?'hidden':''}>${ico('i-main')}Touche l'enveloppe</div>
          <div id="m4txt" style="text-align:left;width:100%" ${S.m4?'':'hidden'}>
            <p class="m4">« Prochaine mission : qui est Dieu ? Ta question d'ici là : "Dieu", c'est un titre. Quel est son vrai nom ? »</p></div>
        </div></div>
      <div class="pres"><p class="tag">Ta boîte à enquêtes</p>
        ${S.boite.length ? `<ul class="boite">${S.boite.map(x=>`<li><b>Niveau ${esc(x.c)}</b> · ${esc(x.q)}</li>`).join('')}</ul>` : '<p class="dire" style="margin:0">Ta boîte est vide pour l\'instant.</p>'}
        <textarea id="tq" placeholder="Ajoute une question" style="margin-top:12px"></textarea>
        <div class="row" style="margin-top:10px"><button class="btn" id="ranger">${ico('i-boite')}Ranger dans ma boîte</button></div>
        <ul id="tl" class="boite"></ul>
      </div>
      <div class="fin" style="justify-content:center"><button class="btn" id="revoir" style="justify-content:center">Revoir la carte</button></div>
    </div></section>`;
  brancherTog(); brancherTour(5);
  $('rendre').onclick = () => { S.verdict = true; S.sc.H = true; S.sc.S = true; S.sc.P = Math.max(S.sc.P,1); save();
    $('rendre').hidden = true; $('tampon').classList.add('on'); $('enbrefBloc').hidden = false;
    document.querySelector('.verdict-zone .sceaux').innerHTML = sceau('H')+sceau('S')+sceau('P');
    setTimeout(()=>{ celebrer($('tampon'), 26); celebrer($('tampon'), 10, true); document.querySelectorAll('.verdict-zone .sceau').forEach(briller) }, calme()?0:700) };
  $('m4').onclick = () => { S.m4 = !S.m4; save(); if (S.m4){ setTimeout(()=>celebrer($('m4'), 10), 600) }
    const e=$('env'); e.classList.toggle('ouvert', S.m4); e.classList.toggle('ferme', !S.m4);
    $('m4hint').hidden = S.m4; setTimeout(()=>{ $('m4txt').hidden = !S.m4 }, S.m4 ? 900 : 0) };
  $('revoir').onclick = () => aller('plateau');
}

/* ----- thème (clair par défaut) et bouton haut-parleur ----- */
const CLE_THEME = 'protocoleV.famille.theme';
const IC_LUNE = '<path d="M15.5 3.5 A8.5 8.5 0 1 0 20.5 15 A7 7 0 0 1 15.5 3.5 Z" fill="currentColor"/>';
const IC_SOLEIL = '<circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
function appliquerTheme(t){
  document.documentElement.dataset.theme = t;
  $('icTheme').innerHTML = t === 'clair' ? IC_LUNE : IC_SOLEIL;
  $('btnTheme').setAttribute('aria-label', t === 'clair' ? 'Passer en thème sombre' : 'Passer en thème clair');
}
let theme = 'clair'; try{ theme = localStorage.getItem(CLE_THEME) || 'clair' }catch(e){}
appliquerTheme(theme);
$('btnTheme').onclick = () => { theme = theme === 'clair' ? 'sombre' : 'clair'; try{ localStorage.setItem(CLE_THEME, theme) }catch(e){}; appliquerTheme(theme) };
function majHP(){
  const m = window.SonsV ? SonsV.estMuet() : true;
  $('hpOn').style.display = m ? 'none' : ''; $('hpOff').style.display = m ? '' : 'none';
  $('btnHP').setAttribute('aria-label', m ? 'Son coupé' : 'Son activé');
}
$('btnHP').onclick = () => { if (window.SonsV) SonsV.muet(!SonsV.estMuet()); majHP() };
majHP();

/* ----- recommencer ----- */
$('btnReset').onclick = () => $('confirm').hidden = false;
$('nonReset').onclick = () => $('confirm').hidden = true;
$('ouiReset').onclick = () => { S = neuf(); save(); $('confirm').hidden = true; render(); window.scrollTo(0,0) };

render();
</script>
</body>
</html>
